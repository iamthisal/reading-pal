es_A_Trimmed_Description_And_Returns_It()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var controller = new BooksController(context);\n\n            var created = Assert.IsType\u003CCreatedAtActionResult\u003E((await controller.Create(NewBook(\u0022  A matchmaker meets her match.  \u0022))).Result);\n            var book = Assert.IsType\u003CBookResponse\u003E(created.Value);\n\n            Assert.Equal(\u0022A matchmaker meets her match.\u0022, book.Description);\n            var fetched = Assert.IsType\u003CBookResponse\u003E(Assert.IsType\u003COkObjectResult\u003E((await controller.GetById(book.Id)).Result).Value);\n            Assert.Equal(\u0022A matchmaker meets her match.\u0022, fetched.Description);\n        }\n\n        [Theory]\n        [InlineData(null)]\n        [InlineData(\u0022   \u0022)]\n        public async Task Create_Without_A_Description_Stores_None(string? description)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var created = Assert.IsType\u003CCreatedAtActionResult\u003E((await new BooksController(context).Create(NewBook(description))).Result);\n\n            Assert.Null(Assert.IsType\u003CBookResponse\u003E(created.Value).Description);\n        }\n\n        [Fact]\n        public async Task Update_Replaces_Keeps_Or_Clears_The_Description()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var controller = new BooksController(context);\n            var id = Assert.IsType\u003CBookResponse\u003E(Assert.IsType\u003CCreatedAtActionResult\u003E((await controller.Create(NewBook(\u0022First.\u0022))).Result).Value).Id;\n\n            BookResponse After(ActionResult\u003CBookResponse\u003E result) =\u003E Assert.IsType\u003CBookResponse\u003E(Assert.IsType\u003COkObjectResult\u003E(result.Result).Value);\n\n            Assert.Equal(\u0022Second.\u0022, After(await controller.Update(id, Changed(\u0022Second.\u0022))).Description);\n            // Older clients do not send the field at all: the description must survive.\n            Assert.Equal(\u0022Second.\u0022, After(await controller.Update(id, Changed(null))).Description);\n            Assert.Null(After(await controller.Update(id, Changed(\u0022\u0022))).Description);\n        }\n\n        [Fact]\n        public void Description_Longer_Than_The_Limit_Is_Invalid()\n        {\n            var request = NewBook(new string(\u0027x\u0027, 2001));\n\n            var valid = System.ComponentModel.DataAnnotations.Validator.TryValidateObject(\n                request, new System.ComponentModel.DataAnnotations.ValidationContext(request), null, validateAllProperties: true);\n\n            Assert.False(valid);\n        }\n    }\n}\n","tests":[{"id":"d3d092d1-935d-b0a2-ad13-82e6083c9b85","name":"InventoryService.Tests.BookDescriptionTests.Create_Stores_A_Trimmed_Description_And_Returns_It","location":{"start":{"line":22,"column":9},"end":{"line":35,"column":10}}},{"id":"6b2de3ca-4f4c-9321-5319-56e07d13f1a2","name":"InventoryService.Tests.BookDescriptionTests.Create_Without_A_Description_Stores_None","location":{"start":{"line":37,"column":9},"end":{"line":48,"column":10}}},{"id":"b7b75783-700d-e01f-82d2-db9d778b92bd","name":"InventoryService.Tests.BookDescriptionTests.Create_Without_A_Description_Stores_None","location":{"start":{"line":37,"column":9},"end":{"line":48,"column":10}}},{"id":"cc83cff4-ee73-49b5-efed-074e93c3fb14","name":"InventoryService.Tests.BookDescriptionTests.Update_Replaces_Keeps_Or_Clears_The_Description","location":{"start":{"line":50,"column":9},"end":{"line":64,"column":10}}},{"id":"eaf3529e-d4e1-9020-a1bb-87abcca2a746","name":"InventoryService.Tests.BookDescriptionTests.Description_Longer_Than_The_Limit_Is_Invalid","location":{"start":{"line":66,"column":9},"end":{"line":75,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\BookEventPublishingTests.cs":{"language":"cs","source":"using InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Kafka;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\n\nnamespace InventoryService.Tests\n{\n    public class BookEventPublishingTests\n    {\n        [Fact]\n        public async Task Create_Publishes_BookCreated_Event_After_Save()\n        {\n            using var context = CreateDbContext();\n            var publisher = new RecordingBookEventPublisher();\n            var controller = new BooksController(context, publisher, NullLogger\u003CBooksController\u003E.Instance);\n\n            var result = await controller.Create(new CreateBookRequest\n            {\n                Title = \u0022Event Driven Design\u0022,\n                Author = \u0022A. Developer\u0022,\n                ISBN = \u0022EVENT-001\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 3\n            });\n\n            var created = Assert.IsType\u003CMicrosoft.AspNetCore.Mvc.CreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(created.Value);\n            var bookEvent = Assert.Single(publisher.Events);\n\n            Assert.Equal(\u0022book-created\u0022, bookEvent.EventType);\n            Assert.Equal(response.Id, bookEvent.BookId);\n            Assert.Equal(response.Id, bookEvent.Book.Id);\n            Assert.Equal(3, bookEvent.Book.AvailableCopies);\n            Assert.NotEqual(Guid.Empty, bookEvent.EventId);\n        }\n\n        [Fact]\n        public async Task MarkUnavailable_Publishes_BookUpdated_Event()\n        {\n            using var context = CreateDbContext();\n            var book = new Models.Book\n            {\n                Title = \u0022Availability Event\u0022,\n                Author = \u0022A. Developer\u0022,\n                ISBN = \u0022EVENT-002\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 2,\n                AvailableCopies = 2,\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var publisher = new RecordingBookEventPublisher();\n            var controller = new BooksController(context, publisher, NullLogger\u003CBooksController\u003E.Instance);\n\n            await controller.MarkUnavailable(book.Id);\n\n            var bookEvent = Assert.Single(publisher.Events);\n            Assert.Equal(\u0022book-updated\u0022, bookEvent.EventType);\n            Assert.Equal(book.Id, bookEvent.BookId);\n            Assert.Equal(0, bookEvent.Book.AvailableCopies);\n        }\n\n        [Fact]\n        public async Task Create_RecordsTheActingAdminAndAction()\n        {\n            using var context = CreateDbContext();\n            var publisher = new RecordingBookEventPublisher();\n            var controller = new BooksController(context, publisher, NullLogger\u003CBooksController\u003E.Instance);\n            AttachAdmin(controller, \u002212\u0022, \u0022admin2@library.test\u0022);\n\n            await controller.Create(new CreateBookRequest\n            {\n                Title = \u0022Who Added This\u0022, Author = \u0022A. Developer\u0022, ISBN = \u0022EVENT-003\u0022, Genre = \u0022Technology\u0022, TotalCopies = 1\n            });\n\n            var bookEvent = Assert.Single(publisher.Events);\n            Assert.Equal(\u0022created\u0022, bookEvent.Action);\n            Assert.Equal(\u002212\u0022, bookEvent.PerformedBy);\n            Assert.Equal(\u0022admin2@library.test\u0022, bookEvent.PerformedByEmail);\n        }\n\n        [Theory]\n        [InlineData(\u0022update\u0022, \u0022updated\u0022)]\n        [InlineData(\u0022unavailable\u0022, \u0022marked-unavailable\u0022)]\n        [InlineData(\u0022available\u0022, \u0022marked-available\u0022)]\n        public async Task BookUpdatedEvents_CarryTheSpecificAction(string operation, string expectedAction)\n        {\n            using var context = CreateDbContext();\n            var book = new Models.Book\n            {\n                Title = \u0022Action Event\u0022, Author = \u0022A. Developer\u0022, ISBN = \u0022EVENT-004\u0022, Genre = \u0022Technology\u0022,\n                TotalCopies = 2, AvailableCopies = operation == \u0022available\u0022 ? 0 : 2,\n                CreatedAt = DateTime.UtcNow, UpdatedAt = DateTime.UtcNow\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n            var publisher = new RecordingBookEventPublisher();\n            var controller = new BooksController(context, publisher, NullLogger\u003CBooksController\u003E.Instance);\n            AttachAdmin(controller, \u0022admin-id\u0022, \u0022admin@library.com\u0022);\n\n            switch (operation)\n            {\n                case \u0022update\u0022:\n                    await controller.Update(book.Id, new UpdateBookRequest\n                    {\n                        Title = \u0022Action Event (2nd ed.)\u0022, Author = \u0022A. Developer\u0022, ISBN = \u0022EVENT-004\u0022, Genre = \u0022Technology\u0022, TotalCopies = 2\n                    });\n                    break;\n                case \u0022unavailable\u0022: await controller.MarkUnavailable(book.Id); break;\n                default: await controller.MarkAvailable(book.Id); break;\n            }\n\n            var bookEvent = Assert.Single(publisher.Events);\n            Assert.Equal(\u0022book-updated\u0022, bookEvent.EventType);\n            Assert.Equal(expectedAction, bookEvent.Action);\n            Assert.Equal(\u0022admin-id\u0022, bookEvent.PerformedBy);\n        }\n\n        private static void AttachAdmin(BooksController controller, string subject, string email)\n        {\n            controller.ControllerContext = new Microsoft.AspNetCore.Mvc.ControllerContext\n            {\n                HttpContext = new Microsoft.AspNetCore.Http.DefaultHttpContext\n                {\n                    User = new System.Security.Claims.ClaimsPrincipal(new System.Security.Claims.ClaimsIdentity(new[]\n                    {\n                        new System.Security.Claims.Claim(System.Security.Claims.ClaimTypes.NameIdentifier, subject),\n                        new System.Security.Claims.Claim(System.Security.Claims.ClaimTypes.Email, email),\n                        new System.Security.Claims.Claim(System.Security.Claims.ClaimTypes.Role, \u0022Admin\u0022)\n                    }, \u0022Test\u0022))\n                }\n            };\n        }\n\n        private static InventoryDbContext CreateDbContext()\n        {\n            var options = new DbContextOptionsBuilder\u003CInventoryDbContext\u003E()\n                .UseInMemoryDatabase(Guid.NewGuid().ToString())\n                .Options;\n\n            return new InventoryDbContext(options);\n        }\n\n        private sealed class RecordingBookEventPublisher : IBookEventPublisher\n        {\n            public List\u003CBookEvent\u003E Events { get; } = new();\n\n            public Task PublishAsync(BookEvent bookEvent, CancellationToken cancellationToken = default)\n            {\n                Events.Add(bookEvent);\n                return Task.CompletedTask;\n            }\n        }\n    }\n}","tests":[{"id":"61b2847f-0197-03ba-1d95-99c73e39fd87","name":"InventoryService.Tests.BookEventPublishingTests.Create_Publishes_BookCreated_Event_After_Save","location":{"start":{"line":12,"column":9},"end":{"line":37,"column":10}}},{"id":"fb694f74-a291-2641-c149-911c5f5b52d1","name":"InventoryService.Tests.BookEventPublishingTests.MarkUnavailable_Publishes_BookUpdated_Event","location":{"start":{"line":39,"column":9},"end":{"line":66,"column":10}}},{"id":"957fa235-c581-2c50-f425-e7b0743d9f8b","name":"InventoryService.Tests.BookEventPublishingTests.Create_RecordsTheActingAdminAndAction","location":{"start":{"line":68,"column":9},"end":{"line":85,"column":10}}},{"id":"3ac97855-ae0f-5705-e22d-5dc2b53e1d89","name":"InventoryService.Tests.BookEventPublishingTests.BookUpdatedEvents_CarryTheSpecificAction","location":{"start":{"line":87,"column":9},"end":{"line":122,"column":10}}},{"id":"3b15336e-be4b-280e-e238-25847cdbf487","name":"InventoryService.Tests.BookEventPublishingTests.BookUpdatedEvents_CarryTheSpecificAction","location":{"start":{"line":87,"column":9},"end":{"line":122,"column":10}}},{"id":"cbd1c855-9589-3463-4c83-d8cba2e8d89d","name":"InventoryService.Tests.BookEventPublishingTests.BookUpdatedEvents_CarryTheSpecificAction","location":{"start":{"line":87,"column":9},"end":{"line":122,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\BookModelTests.cs":{"language":"cs","source":"using System;\nusing InventoryService.Models;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class BookModelTests\n    {\n        [Fact]\n        public void Book_DefaultValues_AreProperlyInitialized()\n        {\n            // Act\n            var book = new Book();\n\n            // Assert\n            Assert.Equal(0, book.Id);\n            Assert.Equal(string.Empty, book.Title);\n            Assert.Equal(string.Empty, book.Author);\n            Assert.Equal(string.Empty, book.ISBN);\n            Assert.Equal(string.Empty, book.Genre);\n            Assert.Null(book.CoverImageUrl);\n            Assert.Equal(0, book.TotalCopies);\n            Assert.Equal(0, book.AvailableCopies);\n            Assert.True(book.CreatedAt \u003C= DateTime.UtcNow);\n            Assert.True(book.UpdatedAt \u003C= DateTime.UtcNow);\n        }\n\n        [Fact]\n        public void Book_CanSetProperties_Correctly()\n        {\n            // Arrange\n            var now = DateTime.UtcNow;\n            var book = new Book\n            {\n                Id = 10,\n                Title = \u0022Clean Code\u0022,\n                Author = \u0022Robert C. Martin\u0022,\n                ISBN = \u0022978-0132350884\u0022,\n                Genre = \u0022Software Engineering\u0022,\n                CoverImageUrl = \u0022https://example.com/clean-code.jpg\u0022,\n                TotalCopies = 5,\n                AvailableCopies = 5,\n                CreatedAt = now,\n                UpdatedAt = now\n            };\n\n            // Assert\n            Assert.Equal(10, book.Id);\n            Assert.Equal(\u0022Clean Code\u0022, book.Title);\n            Assert.Equal(\u0022Robert C. Martin\u0022, book.Author);\n            Assert.Equal(\u0022978-0132350884\u0022, book.ISBN);\n            Assert.Equal(\u0022Software Engineering\u0022, book.Genre);\n            Assert.Equal(\u0022https://example.com/clean-code.jpg\u0022, book.CoverImageUrl);\n            Assert.Equal(5, book.TotalCopies);\n            Assert.Equal(5, book.AvailableCopies);\n            Assert.Equal(now, book.CreatedAt);\n            Assert.Equal(now, book.UpdatedAt);\n        }\n\n        [Fact]\n        public void Book_Validation_Fails_For_InvalidProperties()\n        {\n            // Arrange\n            var book = new Book\n            {\n                Title = \u0022\u0022, // required\n                Author = \u0022\u0022, // required\n                ISBN = new string(\u0027X\u0027, 100), // too long\n                Genre = \u0022\u0022,\n                TotalCopies = -1 // out of range\n            };\n\n            var context = new System.ComponentModel.DataAnnotations.ValidationContext(book);\n            var results = new System.Collections.Generic.List\u003CSystem.ComponentModel.DataAnnotations.ValidationResult\u003E();\n\n            // Act\n            var isValid = System.ComponentModel.DataAnnotations.Validator.TryValidateObject(book, context, results, true);\n\n            // Assert\n            Assert.False(isValid);\n            Assert.Contains(results, r =\u003E r.MemberNames != null \u0026\u0026 r.MemberNames.Contains(\u0022Title\u0022));\n            Assert.Contains(results, r =\u003E r.MemberNames != null \u0026\u0026 r.MemberNames.Contains(\u0022Author\u0022));\n            Assert.Contains(results, r =\u003E r.MemberNames != null \u0026\u0026 r.MemberNames.Contains(\u0022ISBN\u0022));\n            Assert.Contains(results, r =\u003E r.MemberNames != null \u0026\u0026 r.MemberNames.Contains(\u0022TotalCopies\u0022));\n        }\n    }\n}\n","tests":[{"id":"92ea5481-2988-2417-317d-525a1de2f0cd","name":"InventoryService.Tests.BookModelTests.Book_DefaultValues_AreProperlyInitialized","location":{"start":{"line":9,"column":9},"end":{"line":26,"column":10}}},{"id":"5e8a3ab5-26e3-e418-caf2-ee0b3fd229c4","name":"InventoryService.Tests.BookModelTests.Book_CanSetProperties_Correctly","location":{"start":{"line":28,"column":9},"end":{"line":58,"column":10}}},{"id":"462874a3-2213-7cac-eb1b-2fc0e2dbbecb","name":"InventoryService.Tests.BookModelTests.Book_Validation_Fails_For_InvalidProperties","location":{"start":{"line":60,"column":9},"end":{"line":85,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\BooksControllerTests.cs":{"language":"cs","source":"using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Reflection;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class BooksControllerTests\n    {\n        private InventoryDbContext GetDbContext()\n        {\n            var options = new DbContextOptionsBuilder\u003CInventoryDbContext\u003E()\n                .UseInMemoryDatabase(databaseName: Guid.NewGuid().ToString())\n                .Options;\n\n            return new InventoryDbContext(options);\n        }\n\n        // TC-BOOK-001: Admin can add a book successfully and receives 201 Created\n        [Fact]\n        public async Task Admin_Can_Add_Book_Successfully()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022The Pragmatic Programmer\u0022,\n                Author = \u0022David Thomas, Andrew Hunt\u0022,\n                ISBN = \u0022978-0135957059\u0022,\n                Genre = \u0022Technology\u0022,\n                CoverImageUrl = \u0022 https://example.com/pragmatic-programmer.jpg \u0022,\n                TotalCopies = 5\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var createdResult = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            Assert.Equal(201, createdResult.StatusCode);\n\n            var response = Assert.IsType\u003CBookResponse\u003E(createdResult.Value);\n            Assert.True(response.Id \u003E 0);\n            Assert.Equal(\u0022The Pragmatic Programmer\u0022, response.Title);\n            Assert.Equal(\u0022David Thomas, Andrew Hunt\u0022, response.Author);\n            Assert.Equal(\u0022978-0135957059\u0022, response.ISBN);\n            Assert.Equal(\u0022Technology\u0022, response.Genre);\n            Assert.Equal(\u0022https://example.com/pragmatic-programmer.jpg\u0022, response.CoverImageUrl);\n            Assert.Equal(5, response.TotalCopies);\n            Assert.Equal(5, response.AvailableCopies);\n            Assert.True(response.IsAvailable);\n            Assert.Equal(\u0022Available\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-002: Available copies must equal Total copies at creation\n        [Fact]\n        public async Task AvailableCopies_Equals_TotalCopies_On_Creation()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022Design Patterns\u0022,\n                Author = \u0022Erich Gamma, Richard Helm, Ralph Johnson, John Vlissides\u0022,\n                ISBN = \u0022978-0201633610\u0022,\n                Genre = \u0022Software Architecture\u0022,\n                TotalCopies = 8\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var createdResult = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(createdResult.Value);\n\n            Assert.Equal(8, response.TotalCopies);\n            Assert.Equal(8, response.AvailableCopies);\n\n            // Verify persisted entity in database\n            var dbBook = await context.Books.FindAsync(response.Id);\n            Assert.NotNull(dbBook);\n            Assert.Equal(8, dbBook!.TotalCopies);\n            Assert.Equal(8, dbBook.AvailableCopies);\n        }\n\n        // TC-BOOK-002B: Admin can add a book with zero copies so it starts unavailable\n        [Fact]\n        public async Task Admin_Can_Add_Book_With_Zero_Copies_As_Unavailable()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022Coming Soon Book\u0022,\n                Author = \u0022Future Author\u0022,\n                ISBN = \u0022ISBN-ZERO-CREATE\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 0\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var createdResult = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(createdResult.Value);\n\n            Assert.Equal(0, response.TotalCopies);\n            Assert.Equal(0, response.AvailableCopies);\n            Assert.False(response.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-002C: Blank cover image URL is stored as null\n        [Fact]\n        public async Task Add_Book_With_Blank_Cover_Image_Url_Stores_Null()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022Book Without Cover\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-BLANK-COVER\u0022,\n                Genre = \u0022Fiction\u0022,\n                CoverImageUrl = \u0022   \u0022,\n                TotalCopies = 2\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var createdResult = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(createdResult.Value);\n\n            Assert.Null(response.CoverImageUrl);\n            var dbBook = await context.Books.FindAsync(response.Id);\n            Assert.NotNull(dbBook);\n            Assert.Null(dbBook!.CoverImageUrl);\n        }\n\n        // TC-BOOK-003: System sets CreatedAt and UpdatedAt timestamps automatically\n        [Fact]\n        public async Task System_Sets_CreatedAt_And_UpdatedAt_Automatically()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var before = DateTime.UtcNow.AddSeconds(-1);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022Refactoring\u0022,\n                Author = \u0022Martin Fowler\u0022,\n                ISBN = \u0022978-0134757599\u0022,\n                Genre = \u0022Software Design\u0022,\n                TotalCopies = 3\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var createdResult = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(createdResult.Value);\n            var after = DateTime.UtcNow.AddSeconds(1);\n\n            Assert.InRange(response.CreatedAt, before, after);\n            Assert.InRange(response.UpdatedAt, before, after);\n            Assert.Equal(response.CreatedAt, response.UpdatedAt);\n        }\n\n        // TC-BOOK-004: Create endpoint requires Admin role authorization\n        [Fact]\n        public void Add_Book_Requires_Admin_Role()\n        {\n            // Inspect method-level or class-level [Authorize(Roles = \u0022Admin\u0022)]\n            var methodInfo = typeof(BooksController).GetMethod(nameof(BooksController.Create));\n            Assert.NotNull(methodInfo);\n\n            var authorizeAttribute = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E()\n                ?? typeof(BooksController).GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorizeAttribute);\n            Assert.Equal(\u0022Admin\u0022, authorizeAttribute!.Roles);\n        }\n\n        // TC-BOOK-005: Duplicate ISBN returns Conflict (409)\n        [Fact]\n        public async Task Add_Book_With_Duplicate_ISBN_Returns_Conflict()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            context.Books.Add(new Book\n            {\n                Title = \u0022Existing Book\u0022,\n                Author = \u0022Existing Author\u0022,\n                ISBN = \u0022978-0132350884\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 2,\n                AvailableCopies = 2,\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            });\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new CreateBookRequest\n            {\n                Title = \u0022New Book with Same ISBN\u0022,\n                Author = \u0022Another Author\u0022,\n                ISBN = \u0022978-0132350884\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 5\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var conflictResult = Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n            Assert.Equal(409, conflictResult.StatusCode);\n        }\n\n        // TC-BOOK-006: Invalid model state returns BadRequest (400)\n        [Fact]\n        public async Task Add_Book_With_Invalid_ModelState_Returns_BadRequest()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            controller.ModelState.AddModelError(\u0022Title\u0022, \u0022Title is required\u0022);\n\n            var request = new CreateBookRequest\n            {\n                Title = \u0022\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022123456\u0022,\n                Genre = \u0022Genre\u0022,\n                TotalCopies = 1\n            };\n\n            // Act\n            var result = await controller.Create(request);\n\n            // Assert\n            var badRequestResult = Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n            Assert.Equal(400, badRequestResult.StatusCode);\n        }\n\n        // TC-BOOK-007: Get book by ID returns correct book when found\n        [Fact]\n        public async Task GetById_Returns_Book_When_Exists()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Domain-Driven Design\u0022,\n                Author = \u0022Eric Evans\u0022,\n                ISBN = \u0022978-0321125217\u0022,\n                Genre = \u0022Software Architecture\u0022,\n                CoverImageUrl = \u0022https://example.com/ddd.jpg\u0022,\n                TotalCopies = 4,\n                AvailableCopies = 4,\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.GetById(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n            Assert.Equal(book.Id, response.Id);\n            Assert.Equal(\u0022Domain-Driven Design\u0022, response.Title);\n            Assert.Equal(\u0022Eric Evans\u0022, response.Author);\n            Assert.Equal(\u0022https://example.com/ddd.jpg\u0022, response.CoverImageUrl);\n        }\n\n        // TC-BOOK-008: Get book by ID returns NotFound when not exists\n        [Fact]\n        public async Task GetById_Returns_NotFound_When_Not_Exists()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.GetById(999);\n\n            // Assert\n            var notFoundResult = Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n            Assert.Equal(404, notFoundResult.StatusCode);\n        }\n\n        // TC-BOOK-009: GetAll returns all books\n        [Fact]\n        public async Task GetAll_Returns_All_Books()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            context.Books.AddRange(\n                new Book\n                {\n                    Title = \u0022Book A\u0022,\n                    Author = \u0022Author A\u0022,\n                    ISBN = \u0022ISBN-A\u0022,\n                    Genre = \u0022Genre A\u0022,\n                    TotalCopies = 2,\n                    AvailableCopies = 2\n                },\n                new Book\n                {\n                    Title = \u0022Book B\u0022,\n                    Author = \u0022Author B\u0022,\n                    ISBN = \u0022ISBN-B\u0022,\n                    Genre = \u0022Genre B\u0022,\n                    TotalCopies = 4,\n                    AvailableCopies = 4\n                }\n            );\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.GetAll();\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var books = Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(okResult.Value);\n            Assert.Equal(2, books.Count());\n        }\n\n        // TC-BOOK-010: GetAll returns availability status and available copy counts\n        [Fact]\n        public async Task GetAll_Returns_Availability_Status_And_Copy_Counts()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            context.Books.AddRange(\n                new Book\n                {\n                    Title = \u0022Available Book\u0022,\n                    Author = \u0022Author A\u0022,\n                    ISBN = \u0022ISBN-AVAILABLE\u0022,\n                    Genre = \u0022Genre A\u0022,\n                    TotalCopies = 3,\n                    AvailableCopies = 2\n                },\n                new Book\n                {\n                    Title = \u0022Unavailable Book\u0022,\n                    Author = \u0022Author B\u0022,\n                    ISBN = \u0022ISBN-UNAVAILABLE\u0022,\n                    Genre = \u0022Genre B\u0022,\n                    TotalCopies = 4,\n                    AvailableCopies = 0\n                }\n            );\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.GetAll();\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var books = Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(okResult.Value).ToList();\n\n            var availableBook = Assert.Single(books, b =\u003E b.ISBN == \u0022ISBN-AVAILABLE\u0022);\n            Assert.Equal(2, availableBook.AvailableCopies);\n            Assert.True(availableBook.IsAvailable);\n            Assert.Equal(\u0022Available\u0022, availableBook.AvailabilityStatus);\n\n            var unavailableBook = Assert.Single(books, b =\u003E b.ISBN == \u0022ISBN-UNAVAILABLE\u0022);\n            Assert.Equal(0, unavailableBook.AvailableCopies);\n            Assert.False(unavailableBook.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, unavailableBook.AvailabilityStatus);\n        }\n\n        // TC-BOOK-011: Get book by ID returns not available status when no copies remain\n        [Fact]\n        public async Task GetById_Returns_NotAvailable_Status_When_No_Copies_Remain()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Checked Out Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-CHECKED-OUT\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 2,\n                AvailableCopies = 0,\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.GetById(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(0, response.AvailableCopies);\n            Assert.False(response.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-UPDATE-001: Admin can update book details successfully and receives 200 OK\n        [Fact]\n        public async Task Admin_Can_Update_Book_Successfully()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Original Title\u0022,\n                Author = \u0022Original Author\u0022,\n                ISBN = \u0022978-0135957059\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 5,\n                AvailableCopies = 5,\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Updated Title\u0022,\n                Author = \u0022Updated Author\u0022,\n                ISBN = \u0022978-0135957059\u0022,\n                Genre = \u0022Computer Science\u0022,\n                CoverImageUrl = \u0022https://example.com/updated-cover.jpg\u0022,\n                TotalCopies = 8\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(book.Id, response.Id);\n            Assert.Equal(\u0022Updated Title\u0022, response.Title);\n            Assert.Equal(\u0022Updated Author\u0022, response.Author);\n            Assert.Equal(\u0022978-0135957059\u0022, response.ISBN);\n            Assert.Equal(\u0022Computer Science\u0022, response.Genre);\n            Assert.Equal(\u0022https://example.com/updated-cover.jpg\u0022, response.CoverImageUrl);\n            Assert.Equal(8, response.TotalCopies);\n            Assert.Equal(8, response.AvailableCopies);\n\n            var dbBook = await context.Books.FindAsync(book.Id);\n            Assert.NotNull(dbBook);\n            Assert.Equal(\u0022Updated Title\u0022, dbBook!.Title);\n            Assert.Equal(\u0022Updated Author\u0022, dbBook.Author);\n            Assert.Equal(\u0022https://example.com/updated-cover.jpg\u0022, dbBook.CoverImageUrl);\n            Assert.Equal(8, dbBook.TotalCopies);\n            Assert.Equal(8, dbBook.AvailableCopies);\n        }\n\n        // TC-BOOK-UPDATE-002: Update endpoint requires Admin role authorization\n        [Fact]\n        public void Update_Book_Requires_Admin_Role()\n        {\n            var methodInfo = typeof(BooksController).GetMethod(nameof(BooksController.Update));\n            Assert.NotNull(methodInfo);\n\n            var authorizeAttribute = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E()\n                ?? typeof(BooksController).GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorizeAttribute);\n            Assert.Equal(\u0022Admin\u0022, authorizeAttribute!.Roles);\n        }\n\n        // TC-BOOK-UPDATE-003: Updating non-existent book returns NotFound (404)\n        [Fact]\n        public async Task Update_Book_Returns_NotFound_When_Not_Exists()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Some Title\u0022,\n                Author = \u0022Some Author\u0022,\n                ISBN = \u0022978-0135957059\u0022,\n                Genre = \u0022Technology\u0022,\n                TotalCopies = 5\n            };\n\n            // Act\n            var result = await controller.Update(999, request);\n\n            // Assert\n            var notFoundResult = Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n            Assert.Equal(404, notFoundResult.StatusCode);\n        }\n\n        // TC-BOOK-UPDATE-004: Updating book with duplicate ISBN of another book returns Conflict (409)\n        [Fact]\n        public async Task Update_Book_With_Duplicate_ISBN_Returns_Conflict()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            context.Books.AddRange(\n                new Book\n                {\n                    Title = \u0022Book One\u0022,\n                    Author = \u0022Author One\u0022,\n                    ISBN = \u0022978-1111111111\u0022,\n                    Genre = \u0022Fiction\u0022,\n                    TotalCopies = 3,\n                    AvailableCopies = 3\n                },\n                new Book\n                {\n                    Title = \u0022Book Two\u0022,\n                    Author = \u0022Author Two\u0022,\n                    ISBN = \u0022978-2222222222\u0022,\n                    Genre = \u0022Fiction\u0022,\n                    TotalCopies = 4,\n                    AvailableCopies = 4\n                }\n            );\n            await context.SaveChangesAsync();\n\n            var bookTwo = await context.Books.FirstAsync(b =\u003E b.ISBN == \u0022978-2222222222\u0022);\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Book Two Renamed\u0022,\n                Author = \u0022Author Two\u0022,\n                ISBN = \u0022978-1111111111\u0022, // Conflict with Book One\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 4\n            };\n\n            // Act\n            var result = await controller.Update(bookTwo.Id, request);\n\n            // Assert\n            var conflictResult = Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n            Assert.Equal(409, conflictResult.StatusCode);\n        }\n\n        // TC-BOOK-UPDATE-005: Updating book keeping same ISBN succeeds without conflict\n        [Fact]\n        public async Task Update_Book_Keeping_Same_ISBN_Succeeds()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Book One\u0022,\n                Author = \u0022Author One\u0022,\n                ISBN = \u0022978-1111111111\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 3,\n                AvailableCopies = 3\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Book One (Revised Edition)\u0022,\n                Author = \u0022Author One\u0022,\n                ISBN = \u0022978-1111111111\u0022, // Same ISBN\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 5\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n            Assert.Equal(\u0022Book One (Revised Edition)\u0022, response.Title);\n            Assert.Equal(\u0022978-1111111111\u0022, response.ISBN);\n            Assert.Equal(5, response.TotalCopies);\n        }\n\n        // TC-BOOK-UPDATE-006: Invalid model state returns BadRequest (400)\n        [Fact]\n        public async Task Update_Book_With_Invalid_ModelState_Returns_BadRequest()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Valid Book\u0022,\n                Author = \u0022Valid Author\u0022,\n                ISBN = \u0022978-1234567890\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 2,\n                AvailableCopies = 2\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            controller.ModelState.AddModelError(\u0022Title\u0022, \u0022Title is required\u0022);\n\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022\u0022,\n                Author = \u0022Valid Author\u0022,\n                ISBN = \u0022978-1234567890\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 2\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var badRequestResult = Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n            Assert.Equal(400, badRequestResult.StatusCode);\n        }\n\n        // TC-BOOK-UPDATE-007: Updating TotalCopies correctly adjusts AvailableCopies\n        [Fact]\n        public async Task Update_Book_TotalCopies_Adjusts_AvailableCopies_Correctly()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Sample Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022978-3333333333\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 10,\n                AvailableCopies = 7 // 3 copies currently borrowed\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Sample Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022978-3333333333\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 12 // Increased by 2\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n            Assert.Equal(12, response.TotalCopies);\n            Assert.Equal(9, response.AvailableCopies); // 7 \u002B 2 = 9 (or 12 - 3 borrowed = 9)\n\n            var dbBook = await context.Books.FindAsync(book.Id);\n            Assert.NotNull(dbBook);\n            Assert.Equal(12, dbBook!.TotalCopies);\n            Assert.Equal(9, dbBook.AvailableCopies);\n        }\n\n        // TC-BOOK-UPDATE-008: Updating TotalCopies to less than borrowed copies returns BadRequest (400)\n        [Fact]\n        public async Task Update_Book_TotalCopies_Less_Than_Borrowed_Returns_BadRequest()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Sample Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022978-4444444444\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 10,\n                AvailableCopies = 6 // 4 copies borrowed\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Sample Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022978-4444444444\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 3 // Less than 4 borrowed copies\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var badRequestResult = Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n            Assert.Equal(400, badRequestResult.StatusCode);\n        }\n\n        // TC-BOOK-UPDATE-008B: Admin can update total copies to zero when no copies are borrowed\n        [Fact]\n        public async Task Update_Book_TotalCopies_To_Zero_Marks_Book_Unavailable()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Temporary Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022ISBN-ZERO-UPDATE\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 5,\n                AvailableCopies = 5\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Temporary Book\u0022,\n                Author = \u0022Sample Author\u0022,\n                ISBN = \u0022ISBN-ZERO-UPDATE\u0022,\n                Genre = \u0022Tech\u0022,\n                TotalCopies = 0\n            };\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(0, response.TotalCopies);\n            Assert.Equal(0, response.AvailableCopies);\n            Assert.False(response.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-UNAVAILABLE-001: Mark unavailable endpoint requires Admin role authorization\n        [Fact]\n        public void MarkUnavailable_Book_Requires_Admin_Role()\n        {\n            var methodInfo = typeof(BooksController).GetMethod(nameof(BooksController.MarkUnavailable));\n            Assert.NotNull(methodInfo);\n\n            var authorizeAttribute = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorizeAttribute);\n            Assert.Equal(\u0022Admin\u0022, authorizeAttribute!.Roles);\n        }\n\n        // TC-BOOK-UNAVAILABLE-002: Admin can mark a book unavailable when no copies are borrowed\n        [Fact]\n        public async Task MarkUnavailable_With_No_Borrowed_Copies_Sets_Total_And_Available_To_Zero()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Available Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-MARK-ZERO\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 6,\n                AvailableCopies = 6\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.MarkUnavailable(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(0, response.TotalCopies);\n            Assert.Equal(0, response.AvailableCopies);\n            Assert.False(response.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-UNAVAILABLE-003: Mark unavailable preserves borrowed copy count\n        [Fact]\n        public async Task MarkUnavailable_With_Borrowed_Copies_Preserves_Borrowed_Count()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Partly Borrowed Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-MARK-BORROWED\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 5,\n                AvailableCopies = 2\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.MarkUnavailable(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(3, response.TotalCopies);\n            Assert.Equal(0, response.AvailableCopies);\n            Assert.False(response.IsAvailable);\n            Assert.Equal(\u0022Not available now\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-UNAVAILABLE-004: Marking a missing book unavailable returns NotFound\n        [Fact]\n        public async Task MarkUnavailable_Returns_NotFound_When_Book_Does_Not_Exist()\n        {\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n\n            var result = await controller.MarkUnavailable(999);\n\n            var notFoundResult = Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n            Assert.Equal(404, notFoundResult.StatusCode);\n        }\n\n        // TC-BOOK-AVAILABLE-001: Mark available endpoint requires Admin role authorization\n        [Fact]\n        public void MarkAvailable_Book_Requires_Admin_Role()\n        {\n            var methodInfo = typeof(BooksController).GetMethod(nameof(BooksController.MarkAvailable));\n            Assert.NotNull(methodInfo);\n\n            var authorizeAttribute = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorizeAttribute);\n            Assert.Equal(\u0022Admin\u0022, authorizeAttribute!.Roles);\n        }\n\n        // TC-BOOK-AVAILABLE-002: Admin can mark an unavailable book available again\n        [Fact]\n        public async Task MarkAvailable_With_No_Borrowed_Copies_Sets_One_Available_Copy()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Unavailable Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-MARK-AVAILABLE\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 0,\n                AvailableCopies = 0\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.MarkAvailable(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(1, response.TotalCopies);\n            Assert.Equal(1, response.AvailableCopies);\n            Assert.True(response.IsAvailable);\n            Assert.Equal(\u0022Available\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-AVAILABLE-003: Mark available preserves borrowed copy count\n        [Fact]\n        public async Task MarkAvailable_With_Borrowed_Copies_Preserves_Borrowed_Count()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Borrowed Unavailable Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022ISBN-MARK-AVAILABLE-BORROWED\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 3,\n                AvailableCopies = 0\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n\n            // Act\n            var result = await controller.MarkAvailable(book.Id);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n\n            Assert.Equal(4, response.TotalCopies);\n            Assert.Equal(1, response.AvailableCopies);\n            Assert.True(response.IsAvailable);\n            Assert.Equal(\u0022Available\u0022, response.AvailabilityStatus);\n        }\n\n        // TC-BOOK-AVAILABLE-004: Marking a missing book available returns NotFound\n        [Fact]\n        public async Task MarkAvailable_Returns_NotFound_When_Book_Does_Not_Exist()\n        {\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n\n            var result = await controller.MarkAvailable(999);\n\n            var notFoundResult = Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n            Assert.Equal(404, notFoundResult.StatusCode);\n        }\n\n        // TC-BOOK-UPDATE-009: Update modifies UpdatedAt timestamp while preserving CreatedAt\n        [Fact]\n        public async Task Update_Book_Updates_UpdatedAt_And_Preserves_CreatedAt()\n        {\n            // Arrange\n            using var context = GetDbContext();\n            var originalCreatedAt = DateTime.UtcNow.AddDays(-5);\n            var originalUpdatedAt = DateTime.UtcNow.AddDays(-5);\n\n            var book = new Book\n            {\n                Title = \u0022Old Book\u0022,\n                Author = \u0022Old Author\u0022,\n                ISBN = \u0022978-5555555555\u0022,\n                Genre = \u0022History\u0022,\n                TotalCopies = 5,\n                AvailableCopies = 5,\n                CreatedAt = originalCreatedAt,\n                UpdatedAt = originalUpdatedAt\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var request = new UpdateBookRequest\n            {\n                Title = \u0022Updated Book Title\u0022,\n                Author = \u0022Old Author\u0022,\n                ISBN = \u0022978-5555555555\u0022,\n                Genre = \u0022History\u0022,\n                TotalCopies = 5\n            };\n\n            var before = DateTime.UtcNow.AddSeconds(-1);\n\n            // Act\n            var result = await controller.Update(book.Id, request);\n\n            // Assert\n            var okResult = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var response = Assert.IsType\u003CBookResponse\u003E(okResult.Value);\n            var after = DateTime.UtcNow.AddSeconds(1);\n\n            Assert.Equal(originalCreatedAt, response.CreatedAt);\n            Assert.InRange(response.UpdatedAt, before, after);\n            Assert.True(response.UpdatedAt \u003E originalUpdatedAt);\n        }\n\n        // TC-BOOK-DELETE-001: Admin can remove an available book successfully\n        [Fact]\n        public async Task Admin_Can_Delete_Book_Successfully()\n        {\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Book to Remove\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022978-6666666666\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 2,\n                AvailableCopies = 2\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var result = await controller.Delete(book.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Null(await context.Books.FindAsync(book.Id));\n        }\n\n        // TC-BOOK-DELETE-002: Delete endpoint requires Admin role authorization\n        [Fact]\n        public void Delete_Book_Requires_Admin_Role()\n        {\n            var methodInfo = typeof(BooksController).GetMethod(nameof(BooksController.Delete));\n            Assert.NotNull(methodInfo);\n\n            var authorizeAttribute = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorizeAttribute);\n            Assert.Equal(\u0022Admin\u0022, authorizeAttribute!.Roles);\n        }\n\n        // TC-BOOK-DELETE-003: Removing a missing book returns NotFound\n        [Fact]\n        public async Task Delete_Book_Returns_NotFound_When_Not_Exists()\n        {\n            using var context = GetDbContext();\n            var controller = new BooksController(context);\n\n            var result = await controller.Delete(999);\n\n            var notFoundResult = Assert.IsType\u003CNotFoundObjectResult\u003E(result);\n            Assert.Equal(404, notFoundResult.StatusCode);\n        }\n\n        // TC-BOOK-DELETE-004: Books with borrowed copies cannot be removed\n        [Fact]\n        public async Task Delete_Book_With_Borrowed_Copies_Returns_Conflict()\n        {\n            using var context = GetDbContext();\n            var book = new Book\n            {\n                Title = \u0022Borrowed Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022978-7777777777\u0022,\n                Genre = \u0022Fiction\u0022,\n                TotalCopies = 3,\n                AvailableCopies = 2\n            };\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var controller = new BooksController(context);\n            var result = await controller.Delete(book.Id);\n\n            var conflictResult = Assert.IsType\u003CConflictObjectResult\u003E(result);\n            Assert.Equal(409, conflictResult.StatusCode);\n            Assert.NotNull(await context.Books.FindAsync(book.Id));\n        }\n\n    }\n}\n","tests":[{"id":"f8ecc42a-79c1-f3d5-884a-40138891f539","name":"InventoryService.Tests.BooksControllerTests.Admin_Can_Add_Book_Successfully","location":{"start":{"line":29,"column":9},"end":{"line":63,"column":10}}},{"id":"b95bade5-4cb3-d355-8b59-2f63352f06fa","name":"InventoryService.Tests.BooksControllerTests.AvailableCopies_Equals_TotalCopies_On_Creation","location":{"start":{"line":66,"column":9},"end":{"line":96,"column":10}}},{"id":"3e5646e7-b139-41ed-cf29-a73052323a33","name":"InventoryService.Tests.BooksControllerTests.Admin_Can_Add_Book_With_Zero_Copies_As_Unavailable","location":{"start":{"line":99,"column":9},"end":{"line":125,"column":10}}},{"id":"8b d":{"line":958,"column":10}}},{"id":"68b11793-303d-89df-f029-f548d792bc8b","name":"InventoryService.Tests.BooksControllerTests.Update_Book_Updates_UpdatedAt_And_Preserves_CreatedAt","location":{"start":{"line":961,"column":9},"end":{"line":1006,"column":10}}},{"id":"24db26e8-a9a0-72ce-21ab-2b21f401a578","name":"InventoryService.Tests.BooksControllerTests.Admin_Can_Delete_Book_Successfully","location":{"start":{"line":1009,"column":9},"end":{"line":1030,"column":10}}},{"id":"4e594bab-a3eb-1dfa-ec5a-73042e8135e9","name":"InventoryService.Tests.BooksControllerTests.Delete_Book_Requires_Admin_Role","location":{"start":{"line":1033,"column":9},"end":{"line":1043,"column":10}}},{"id":"9fa30a5f-7efd-b834-499b-41eddd0f5734","name":"InventoryService.Tests.BooksControllerTests.Delete_Book_Returns_NotFound_When_Not_Exists","location":{"start":{"line":1046,"column":9},"end":{"line":1056,"column":10}}},{"id":"da577b09-10f9-2add-595e-6361e3ca9c0c","name":"InventoryService.Tests.BooksControllerTests.Delete_Book_With_Borrowed_Copies_Returns_Conflict","location":{"start":{"line":1059,"column":9},"end":{"line":1081,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\BookSearchControllerTests.cs":{"language":"cs","source":"using System;\nusing System.Linq;\nusing System.Reflection;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class BookSearchControllerTests\n    {\n        private static async Task SeedAsync(InventoryDbContext context)\n        {\n            context.Books.AddRange(\n                CatalogueTestData.Book(\u0022Dune\u0022, \u0022Frank Herbert\u0022, \u0022Science Fiction\u0022, available: 2, createdAt: new DateTime(2026, 1, 1)),\n                CatalogueTestData.Book(\u0022Dune Messiah\u0022, \u0022Frank Herbert\u0022, \u0022Science Fiction\u0022, available: 0, createdAt: new DateTime(2026, 1, 2)),\n                CatalogueTestData.Book(\u0022The Sand Dune Mystery\u0022, \u0022Agatha Christie\u0022, \u0022Mystery\u0022, available: 1, createdAt: new DateTime(2026, 1, 3)),\n                CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022, \u0022Classics\u0022, available: 1, createdAt: new DateTime(2026, 1, 4)),\n                CatalogueTestData.Book(\u0022Persuasion\u0022, \u0022Jane Austen\u0022, \u0022Classics\u0022, available: 0, createdAt: new DateTime(2026, 1, 5)),\n                CatalogueTestData.Book(\u0022Herbert\u0027s Garden\u0022, \u0022Dune Gardener\u0022, \u0022Non-fiction\u0022, available: 1, createdAt: new DateTime(2026, 1, 6)));\n            await context.SaveChangesAsync();\n        }\n\n        private static async Task\u003CBookSearchResponse\u003E SearchAsync(InventoryDbContext context, string? q = null, string[]? genres = null,\n            bool availableOnly = false, string? sort = null, int page = 1, int pageSize = BookSearchController.DefaultPageSize)\n        {\n            var result = await new BookSearchController(context).Search(q, genres, availableOnly, sort, page, pageSize);\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            return Assert.IsType\u003CBookSearchResponse\u003E(ok.Value);\n        }\n\n        [Fact]\n        public async Task No_Query_Returns_Every_Book_Newest_First()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context);\n\n            Assert.Equal(6, response.Total);\n            Assert.Equal(\u0022Herbert\u0027s Garden\u0022, response.Items.First().Title);\n            Assert.Equal(\u0022Dune\u0022, response.Items.Last().Title);\n        }\n\n        [Theory]\n        [InlineData(\u0022emma\u0022, \u0022Emma\u0022)]\n        [InlineData(\u0022AUSTEN\u0022, \u0022Emma,Persuasion\u0022)]\n        [InlineData(\u0022classics\u0022, \u0022Emma,Persuasion\u0022)]\n        [InlineData(\u0022  christie  \u0022, \u0022The Sand Dune Mystery\u0022)]\n        public async Task Query_Matches_Title_Author_Or_Category_Ignoring_Case(string query, string expectedTitles)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, query, sort: \u0022title\u0022);\n\n            Assert.Equal(expectedTitles.Split(\u0027,\u0027), response.Items.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task Query_Matches_Isbn()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Clean Code\u0022);\n            book.ISBN = \u00229780132350884\u0022;\n            context.Books.AddRange(book, CatalogueTestData.Book(\u0022Other\u0022));\n            await context.SaveChangesAsync();\n\n            var response = await SearchAsync(context, \u00220132350\u0022);\n\n            Assert.Equal(\u0022Clean Code\u0022, Assert.Single(response.Items).Title);\n        }\n\n        [Fact]\n        public async Task Every_Word_Must_Match_But_May_Match_Different_Fields()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, \u0022herbert messiah\u0022);\n\n            Assert.Equal(\u0022Dune Messiah\u0022, Assert.Single(response.Items).Title);\n        }\n\n        [Fact]\n        public async Task Relevance_Puts_Title_Prefix_Then_Title_Then_Author_Matches()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, \u0022dune\u0022);\n\n            Assert.Equal(new[] { \u0022Dune\u0022, \u0022Dune Messiah\u0022, \u0022The Sand Dune Mystery\u0022, \u0022Herbert\u0027s Garden\u0022 }, response.Items.Select(b =\u003E b.Title));\n        }\n\n        [Theory]\n        [InlineData(\u0022title\u0022, \u0022Dune,Dune Messiah,Emma\u0022)]\n        [InlineData(\u0022author\u0022, \u0022The Sand Dune Mystery,Herbert\u0027s Garden,Dune\u0022)]\n        [InlineData(\u0022newest\u0022, \u0022Herbert\u0027s Garden,Persuasion,Emma\u0022)]\n        public async Task Sort_Orders_The_Results(string sort, string expectedFirstThree)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, sort: sort);\n\n            Assert.Equal(expectedFirstThree.Split(\u0027,\u0027), response.Items.Take(3).Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task Genre_Filter_Accepts_Several_Categories()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, genres: new[] { \u0022classics\u0022, \u0022 Mystery \u0022 }, sort: \u0022title\u0022);\n\n            Assert.Equal(new[] { \u0022Emma\u0022, \u0022Persuasion\u0022, \u0022The Sand Dune Mystery\u0022 }, response.Items.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task AvailableOnly_Hides_Books_With_No_Copies()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, \u0022dune\u0022, availableOnly: true);\n\n            Assert.DoesNotContain(response.Items, b =\u003E b.Title == \u0022Dune Messiah\u0022);\n            Assert.Equal(3, response.Total);\n        }\n\n        [Fact]\n        public async Task Genre_Counts_Ignore_The_Genre_Filter_But_Respect_Query_And_Availability()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, \u0022dune\u0022, genres: new[] { \u0022Mystery\u0022 }, availableOnly: true);\n\n            Assert.Equal(1, response.Total);\n            Assert.Equal(new[] { \u0022Mystery:1\u0022, \u0022Non-fiction:1\u0022, \u0022Science Fiction:1\u0022 }, response.Facets.Genres.Select(g =\u003E $\u0022{g.Name}:{g.Count}\u0022));\n        }\n\n        [Fact]\n        public async Task Available_Count_Ignores_The_Availability_Filter_But_Respects_Query_And_Genres()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, genres: new[] { \u0022Classics\u0022 });\n\n            Assert.Equal(2, response.Total);\n            Assert.Equal(1, response.Facets.AvailableCount);\n        }\n\n        [Fact]\n        public async Task Results_Are_Paged()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var second = await SearchAsync(context, sort: \u0022title\u0022, page: 2, pageSize: 4);\n\n            Assert.Equal(6, second.Total);\n            Assert.Equal(2, second.TotalPages);\n            Assert.Equal(2, second.Page);\n            Assert.Equal(new[] { \u0022Persuasion\u0022, \u0022The Sand Dune Mystery\u0022 }, second.Items.Select(b =\u003E b.Title));\n        }\n\n        [Theory]\n        [InlineData(99, 2)]\n        [InlineData(0, 1)]\n        [InlineData(-3, 1)]\n        public async Task Out_Of_Range_Pages_Are_Clamped(int requested, int expected)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, page: requested, pageSize: 4);\n\n            Assert.Equal(expected, response.Page);\n            Assert.NotEmpty(response.Items);\n        }\n\n        [Theory]\n        [InlineData(0, BookSearchController.DefaultPageSize)]\n        [InlineData(1000, BookSearchController.MaxPageSize)]\n        public async Task Page_Size_Is_Kept_Within_Limits(int requested, int expected)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            Assert.Equal(expected, (await SearchAsync(context, pageSize: requested)).PageSize);\n        }\n\n        [Fact]\n        public async Task No_Matches_Returns_An_Empty_First_Page()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            var response = await SearchAsync(context, \u0022zzzz\u0022);\n\n            Assert.Empty(response.Items);\n            Assert.Equal(0, response.Total);\n            Assert.Equal(1, response.Page);\n            Assert.Equal(1, response.TotalPages);\n            Assert.Empty(response.Facets.Genres);\n        }\n\n        [Fact]\n        public async Task Wildcard_Characters_Are_Treated_As_Plain_Text()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await SeedAsync(context);\n\n            Assert.Equal(0, (await SearchAsync(context, \u0022%\u0022)).Total);\n            Assert.Equal(0, (await SearchAsync(context, \u0022_une\u0022)).Total);\n        }\n\n        [Fact]\n        public void Search_Is_Public()\n        {\n            Assert.Null(typeof(BookSearchController).GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n            Assert.Null(typeof(BookSearchController).GetMethod(nameof(BookSearchController.Search))!.GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n        }\n    }\n}\n","tests":[{"id":"f94e1c2b-2e2b-9aba-9fcf-58a8fe2b46b1","name":"InventoryService.Tests.BookSearchControllerTests.No_Query_Returns_Every_Book_Newest_First","location":{"start":{"line":37,"column":9},"end":{"line":49,"column":10}}},{"id":"46b1df5f-a6f6-b9f9-93c2-8e5a783fbed6","name":"InventoryService.Tests.BookSearchControllerTests.Query_Matches_Title_Author_Or_Category_Ignoring_Case","location":{"start":{"line":51,"column":9},"end":{"line":65,"column":10}}},{"id":"4b9a29a7-7a96-b24d-e9f9-b7c92a101fa3","name":"InventoryService.Tests.BookSearchControllerTests.Query_Matches_Title_Author_Or_Category_Ignoring_Case","location":{"start":{"line":51,"column":9},"end":{"line":65,"column":10}}},{"id":"7b42fb97-6bc8-d3b3-bf44-7a6fd1ed0bba","name":"InventoryService.Tests.BookSearchControllerTests.Query_Matches_Title_Author_Or_Category_Ignoring_Case","location":{"start":{"line":51,"column":9},"end":{"line":65,"column":10}}},{"id":"2598d22e-6be8-c865-e6f7-b44055507678","name":"InventoryService.Tests.BookSearchControllerTests.Query_Matches_Title_Author_Or_Category_Ignoring_Case","location":{"start":{"line":51,"column":9},"end":{"line":65,"column":10}}},{"id":"b88b3848-a0a3-0bb0-7ecf-ae1f015e6c18","name":"InventoryService.Tests.BookSe
