\n            await Assert.ThrowsAsync\u003CDbUpdateException\u003E(() =\u003E context.SaveChangesAsync());\n        }\n\n        [Fact]\n        public async Task List_Keys_Must_Be_Unique()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.CuratedLists.AddRange(new CuratedList { Key = \u0022top-100\u0022, Name = \u0022A\u0022 }, new CuratedList { Key = \u0022top-100\u0022, Name = \u0022B\u0022 });\n\n            await Assert.ThrowsAsync\u003CDbUpdateException\u003E(() =\u003E context.SaveChangesAsync());\n        }\n\n        [Fact]\n        public async Task A_Book_Cannot_Be_On_The_Same_List_Twice()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            var list = new CuratedList { Key = \u0022classics\u0022, Name = \u0022Classics\u0022 };\n            context.AddRange(book, list);\n            await context.SaveChangesAsync();\n            context.CuratedListItems.AddRange(\n                new CuratedListItem { CuratedListId = list.Id, BookId = book.Id, Position = 0 },\n                new CuratedListItem { CuratedListId = list.Id, BookId = book.Id, Position = 1 });\n\n            await Assert.ThrowsAsync\u003CDbUpdateException\u003E(() =\u003E context.SaveChangesAsync());\n        }\n\n        [Fact]\n        public async Task List_ItemType_Is_Stored_As_Text()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using (var context = factory.CreateContext())\n            {\n                context.CuratedLists.Add(new CuratedList { Key = \u0022popular-authors\u0022, Name = \u0022Popular Authors\u0022, ItemType = CuratedListItemType.Authors });\n                await context.SaveChangesAsync();\n            }\n\n            using var check = factory.CreateContext();\n            var stored = await check.Database.SqlQueryRaw\u003Cstring\u003E(\u0022SELECT ItemType AS Value FROM CuratedLists\u0022).SingleAsync();\n            Assert.Equal(\u0022Authors\u0022, stored);\n        }\n\n        [Fact]\n        public async Task Deleting_A_Book_Removes_It_From_Its_Lists()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            int listId;\n            using (var context = factory.CreateContext())\n            {\n                var kept = CatalogueTestData.Book(\u0022Kept\u0022);\n                var removed = CatalogueTestData.Book(\u0022Removed\u0022);\n                var list = new CuratedList { Key = \u0022top-100\u0022, Name = \u0022Top 100\u0022 };\n                context.AddRange(kept, removed, list);\n                await context.SaveChangesAsync();\n                context.CuratedListItems.AddRange(\n                    new CuratedListItem { CuratedListId = list.Id, BookId = removed.Id, Position = 0 },\n                    new CuratedListItem { CuratedListId = list.Id, BookId = kept.Id, Position = 1 });\n                await context.SaveChangesAsync();\n                listId = list.Id;\n\n                context.Books.Remove(removed);\n                await context.SaveChangesAsync();\n            }\n\n            using var check = factory.CreateContext();\n            var item = await check.CuratedListItems.Include(i =\u003E i.Book).SingleAsync(i =\u003E i.CuratedListId == listId);\n            Assert.Equal(\u0022Kept\u0022, item.Book!.Title);\n        }\n\n        [Fact]\n        public async Task Deleting_A_List_Removes_Its_Items_But_Not_The_Books()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using (var context = factory.CreateContext())\n            {\n                var book = CatalogueTestData.Book(\u0022Emma\u0022);\n                var list = new CuratedList { Key = \u0022classics\u0022, Name = \u0022Classics\u0022 };\n                context.AddRange(book, list);\n                await context.SaveChangesAsync();\n                context.CuratedListItems.Add(new CuratedListItem { CuratedListId = list.Id, BookId = book.Id });\n                await context.SaveChangesAsync();\n\n                context.CuratedLists.Remove(list);\n                await context.SaveChangesAsync();\n            }\n\n            using var check = factory.CreateContext();\n            Assert.Empty(await check.CuratedListItems.ToListAsync());\n            Assert.Single(await check.Books.ToListAsync());\n        }\n    }\n}\n","tests":[{"id":"78b26118-e899-f0d6-be99-c23ff3e9e0ef","name":"InventoryService.Tests.CatalogueModelTests.Author_DefaultValues_AreProperlyInitialized","location":{"start":{"line":13,"column":9},"end":{"line":22,"column":10}}},{"id":"ff9c0266-911c-e374-8051-0743ee6342a1","name":"InventoryService.Tests.CatalogueModelTests.CuratedList_DefaultValues_AreProperlyInitialized","location":{"start":{"line":24,"column":9},"end":{"line":35,"column":10}}},{"id":"088f6322-cdbc-4646-a5bf-8b85dc821a5d","name":"InventoryService.Tests.CatalogueModelTests.CuratedListItem_DefaultValues_PointAtNothing","location":{"start":{"line":37,"column":9},"end":{"line":45,"column":10}}},{"id":"8141d54a-15f1-928f-e87c-11b00479c07d","name":"InventoryService.Tests.CatalogueModelTests.Author_Names_Must_Be_Unique","location":{"start":{"line":47,"column":9},"end":{"line":55,"column":10}}},{"id":"e5450387-0304-5b2c-87c3-6c9944856ed0","name":"InventoryService.Tests.CatalogueModelTests.List_Keys_Must_Be_Unique","location":{"start":{"line":57,"column":9},"end":{"line":65,"column":10}}},{"id":"d4e1126c-793e-5145-4f6c-e940a4a6be10","name":"InventoryService.Tests.CatalogueModelTests.A_Book_Cannot_Be_On_The_Same_List_Twice","location":{"start":{"line":67,"column":9},"end":{"line":81,"column":10}}},{"id":"cdb0ea27-f009-2b6b-a2a8-398522a7c2fd","name":"InventoryService.Tests.CatalogueModelTests.List_ItemType_Is_Stored_As_Text","location":{"start":{"line":83,"column":9},"end":{"line":96,"column":10}}},{"id":"78e93325-dbee-7e31-64b2-5c634de4d7fb","name":"InventoryService.Tests.CatalogueModelTests.Deleting_A_Book_Removes_It_From_Its_Lists","location":{"start":{"line":98,"column":9},"end":{"line":123,"column":10}}},{"id":"523c48c6-1782-3de8-2e4d-9c5b264635a8","name":"InventoryService.Tests.CatalogueModelTests.Deleting_A_List_Removes_Its_Items_But_Not_The_Books","location":{"start":{"line":125,"column":9},"end":{"line":145,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\Controllers\\BooksControllerCheckoutTests.cs":{"language":"cs","source":"using InventoryService.Controllers;\nusing InventoryService.Models;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace InventoryService.Tests.Controllers;\n\npublic class BooksControllerCheckoutTests : IDisposable\n{\n    private readonly SqliteInventoryDbContextFactory _factory = new();\n\n    public void Dispose() =\u003E _factory.Dispose();\n\n    private static Book NewBook(int id, int availableCopies) =\u003E new()\n    {\n        Id = id,\n        Title = \u0022Clean Code\u0022,\n        Author = \u0022Robert C. Martin\u0022,\n        ISBN = $\u0022ISBN-{id}\u0022,\n        Genre = \u0022Software\u0022,\n        TotalCopies = Math.Max(availableCopies, 1),\n        AvailableCopies = availableCopies\n    };\n\n    [Theory]\n    [InlineData(0, 1)]\n    [InlineData(1, 0)]\n    [InlineData(-1, 1)]\n    public async Task Checkout_WithNonPositiveIds_ReturnsBadRequest(int bookId, int reservationId)\n    {\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(bookId, reservationId, CancellationToken.None);\n\n        Assert.IsType\u003CBadRequestObjectResult\u003E(result);\n    }\n\n    [Fact]\n    public async Task Checkout_WhenBookDoesNotExist_ReturnsNotFound()\n    {\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(id: 999, reservationId: 1, CancellationToken.None);\n\n        Assert.IsType\u003CNotFoundObjectResult\u003E(result);\n    }\n\n    [Fact]\n    public async Task Checkout_WhenNoCopiesAvailable_ReturnsConflict()\n    {\n        using (var setup = _factory.CreateContext())\n        {\n            setup.Books.Add(NewBook(id: 1, availableCopies: 0));\n            await setup.SaveChangesAsync();\n        }\n\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(id: 1, reservationId: 1, CancellationToken.None);\n\n        Assert.IsType\u003CConflictObjectResult\u003E(result);\n    }\n\n    [Fact]\n    public async Task Checkout_WhenACopyIsAvailable_DecrementsAvailableCopiesAndRecordsCheckout()\n    {\n        using (var setup = _factory.CreateContext())\n        {\n            setup.Books.Add(NewBook(id: 1, availableCopies: 3));\n            await setup.SaveChangesAsync();\n        }\n\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(id: 1, reservationId: 42, CancellationToken.None);\n\n        Assert.IsType\u003COkObjectResult\u003E(result);\n\n        using var verify = _factory.CreateContext();\n        var book = await verify.Books.FindAsync(1);\n        Assert.Equal(2, book!.AvailableCopies);\n\n        var checkout = await verify.BookCheckouts.FindAsync(42);\n        Assert.NotNull(checkout);\n        Assert.Equal(1, checkout!.BookId);\n    }\n\n    [Fact]\n    public async Task Checkout_WhenReservationAlreadyCheckedOutSameBook_ReturnsOkWithoutDoubleDeducting()\n    {\n        using (var setup = _factory.CreateContext())\n        {\n            setup.Books.Add(NewBook(id: 1, availableCopies: 3));\n            await setup.SaveChangesAsync();\n        }\n\n        using (var first = _factory.CreateContext())\n        {\n            var firstController = new BooksController(first);\n            await firstController.Checkout(id: 1, reservationId: 42, CancellationToken.None);\n        }\n\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(id: 1, reservationId: 42, CancellationToken.None);\n\n        Assert.IsType\u003COkObjectResult\u003E(result);\n\n        using var verify = _factory.CreateContext();\n        var book = await verify.Books.FindAsync(1);\n        Assert.Equal(2, book!.AvailableCopies);\n    }\n\n    [Fact]\n    public async Task Checkout_WhenReservationAlreadyCheckedOutDifferentBook_ReturnsConflict()\n    {\n        using (var setup = _factory.CreateContext())\n        {\n            setup.Books.Add(NewBook(id: 1, availableCopies: 3));\n            setup.Books.Add(NewBook(id: 2, availableCopies: 3));\n            await setup.SaveChangesAsync();\n        }\n\n        using (var first = _factory.CreateContext())\n        {\n            var firstController = new BooksController(first);\n            await firstController.Checkout(id: 1, reservationId: 42, CancellationToken.None);\n        }\n\n        using var context = _factory.CreateContext();\n        var controller = new BooksController(context);\n\n        var result = await controller.Checkout(id: 2, reservationId: 42, CancellationToken.None);\n\n        Assert.IsType\u003CConflictObjectResult\u003E(result);\n    }\n}\n","tests":[{"id":"d5f6b4b8-4c0f-36ad-2c87-a5fcfdb7accd","name":"InventoryService.Tests.Controllers.BooksControllerCheckoutTests.Checkout_WithNonPositiveIds_ReturnsBadRequest","location":{"start":{"line":25,"column":5},"end":{"line":37,"column":6}}},{"id":"cd1ff635-b0f0-7614-48ea-841ea09a74 ce.Models;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace InventoryService.Tests.Controllers;\n\npublic sealed class BooksControllerReturnCheckoutTests : IDisposable\n{\n    private readonly SqliteInventoryDbContextFactory _factory = new();\n\n    public void Dispose() =\u003E _factory.Dispose();\n\n    private async Task SeedCheckout(int bookId = 1, int reservationId = 42, int available = 1, int total = 2)\n    {\n        using var context = _factory.CreateContext();\n        context.Books.Add(new Book\n        {\n            Id = bookId,\n            Title = \u0022Clean Code\u0022,\n            Author = \u0022Robert C. Martin\u0022,\n            ISBN = $\u0022RETURN-{bookId}\u0022,\n            Genre = \u0022Software\u0022,\n            TotalCopies = total,\n            AvailableCopies = available\n        });\n        context.BookCheckouts.Add(new BookCheckout\n        {\n            Id = reservationId,\n            BookId = bookId,\n            CheckoutDateUtc = DateTime.UtcNow.AddDays(-2)\n        });\n        await context.SaveChangesAsync();\n    }\n\n    [Fact]\n    public async Task ReturnCheckout_WithMatchingCheckout_RestoresOneCopyAndMarksReturned()\n    {\n        await SeedCheckout();\n        using var context = _factory.CreateContext();\n\n        var result = await new BooksController(context).ReturnCheckout(1, 42, CancellationToken.None);\n\n        Assert.IsType\u003COkObjectResult\u003E(result);\n        using var verify = _factory.CreateContext();\n        Assert.Equal(2, (await verify.Books.FindAsync(1))!.AvailableCopies);\n        Assert.NotNull((await verify.BookCheckouts.FindAsync(42))!.ReturnDateUtc);\n    }\n\n    [Fact]\n    public async Task ReturnCheckout_WhenRetried_DoesNotRestoreAnotherCopy()\n    {\n        await SeedCheckout(available: 0, total: 2);\n        using (var first = _factory.CreateContext())\n            Assert.IsType\u003COkObjectResult\u003E(await new BooksController(first).ReturnCheckout(1, 42, CancellationToken.None));\n\n        using (var retry = _factory.CreateContext())\n            Assert.IsType\u003COkObjectResult\u003E(await new BooksController(retry).ReturnCheckout(1, 42, CancellationToken.None));\n\n        using var verify = _factory.CreateContext();\n        Assert.Equal(1, (await verify.Books.FindAsync(1))!.AvailableCopies);\n    }\n\n    [Theory]\n    [InlineData(1, 999)]\n    [InlineData(999, 42)]\n    public async Task ReturnCheckout_WithoutMatchingCheckout_ReturnsNotFound(int bookId, int reservationId)\n    {\n        await SeedCheckout();\n        using var context = _factory.CreateContext();\n\n        var result = await new BooksController(context).ReturnCheckout(bookId, reservationId, CancellationToken.None);\n\n        Assert.IsType\u003CNotFoundObjectResult\u003E(result);\n    }\n\n    [Fact]\n    public async Task ReturnCheckout_WhenInventoryIsAlreadyFull_RollsBackReturnMarker()\n    {\n        await SeedCheckout(available: 2, total: 2);\n        using (var context = _factory.CreateContext())\n            Assert.IsType\u003CConflictObjectResult\u003E(await new BooksController(context).ReturnCheckout(1, 42, CancellationToken.None));\n\n        using var verify = _factory.CreateContext();\n        Assert.Equal(2, (await verify.Books.FindAsync(1))!.AvailableCopies);\n        Assert.Null((await verify.BookCheckouts.FindAsync(42))!.ReturnDateUtc);\n    }\n}\n","tests":[{"id":"63b2d704-de1b-f8ef-230a-d4754904598b","name":"InventoryService.Tests.Controllers.BooksControllerReturnCheckoutTests.ReturnCheckout_WithMatchingCheckout_RestoresOneCopyAndMarksReturned","location":{"start":{"line":36,"column":5},"end":{"line":48,"column":6}}},{"id":"d1617a33-3e9c-dcfa-ca32-7e5c8a7b0acb","name":"InventoryService.Tests.Controllers.BooksControllerReturnCheckoutTests.ReturnCheckout_WhenRetried_DoesNotRestoreAnotherCopy","location":{"start":{"line":50,"column":5},"end":{"line":62,"column":6}}},{"id":"a4682ecc-6f05-6b2d-e485-d757f1b157a1","name":"InventoryService.Tests.Controllers.BooksControllerReturnCheckoutTests.ReturnCheckout_WithoutMatchingCheckout_ReturnsNotFound","location":{"start":{"line":64,"column":5},"end":{"line":75,"column":6}}},{"id":"36432221-f304-badb-f21d-0b2045efdeae","name":"InventoryService.Tests.Controllers.BooksControllerReturnCheckoutTests.ReturnCheckout_WithoutMatchingCheckout_ReturnsNotFound","location":{"start":{"line":64,"column":5},"end":{"line":75,"column":6}}},{"id":"f8e0d86d-4c94-fc68-9ef7-054b0ee77370","name":"InventoryService.Tests.Controllers.BooksControllerReturnCheckoutTests.ReturnCheckout_WhenInventoryIsAlreadyFull_RollsBackReturnMarker","location":{"start":{"line":77,"column":5},"end":{"line":87,"column":6}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\FavouritesControllerTests.cs":{"language":"cs","source":"using System.Collections.Generic;\nusing System.Linq;\nusing System.Reflection;\nusing System.Security.Claims;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Http;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class FavouritesControllerTests\n    {\n        private static FavouritesController ControllerFor(InventoryDbContext context, string? userId)\n        {\n            var identity = userId == null\n                ? new ClaimsIdentity()\n                : new ClaimsIdentity(new[] { new Claim(ClaimTypes.NameIdentifier, userId) }, \u0022Test\u0022);\n            return new FavouritesController(context)\n            {\n                ControllerContext = new ControllerContext { HttpContext = new DefaultHttpContext { User = new ClaimsPrincipal(identity) } }\n            };\n        }\n\n        private static List\u003CBookResponse\u003E Books(ActionResult\u003CIEnumerable\u003CBookResponse\u003E\u003E result)\n        {\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            return Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(ok.Value).ToList();\n        }\n\n        [Fact]\n        public void FavouriteBook_DefaultValues_AreProperlyInitialized()\n        {\n            var favourite = new FavouriteBook();\n\n            Assert.Equal(string.Empty, favourite.UserId);\n            Assert.Equal(0, favourite.BookId);\n            Assert.True(favourite.CreatedAt \u003C= System.DateTime.UtcNow);\n        }\n\n        [Fact]\n        public async Task Add_Marks_The_Book_For_That_Reader_Only()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n\n            var result = await ControllerFor(context, \u0022reader-1\u0022).Add(book.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Equal(\u0022Emma\u0022, Assert.Single(Books(await ControllerFor(context, \u0022reader-1\u0022).GetAll())).Title);\n            Assert.Empty(Books(await ControllerFor(context, \u0022reader-2\u0022).GetAll()));\n        }\n\n        [Fact]\n        public async Task Add_Twice_Keeps_A_Single_Favourite()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n            var controller = ControllerFor(context, \u0022reader-1\u0022);\n\n            await controller.Add(book.Id);\n            var second = await controller.Add(book.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(second);\n            Assert.Equal(1, await context.FavouriteBooks.CountAsync());\n        }\n\n        [Fact]\n        public async Task Add_Unknown_Book_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await ControllerFor(context, \u0022reader-1\u0022).Add(999);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result);\n            Assert.Empty(await context.FavouriteBooks.ToListAsync());\n        }\n\n        [Fact]\n        public async Task GetAll_Returns_Most_Recently_Added_First()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var first = CatalogueTestData.Book(\u0022First\u0022);\n            var second = CatalogueTestData.Book(\u0022Second\u0022);\n            context.Books.AddRange(first, second);\n            await context.SaveChangesAsync();\n            context.FavouriteBooks.AddRange(\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = first.Id, CreatedAt = new System.DateTime(2026, 1, 1) },\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = second.Id, CreatedAt = new System.DateTime(2026, 2, 1) });\n            await context.SaveChangesAsync();\n\n            var books = Books(await ControllerFor(context, \u0022reader-1\u0022).GetAll());\n\n            Assert.Equal(new[] { \u0022Second\u0022, \u0022First\u0022 }, books.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task GetIds_Returns_Only_The_Readers_Own_Book_Ids()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var mine = CatalogueTestData.Book(\u0022Mine\u0022);\n            var theirs = CatalogueTestData.Book(\u0022Theirs\u0022);\n            context.Books.AddRange(mine, theirs);\n            await context.SaveChangesAsync();\n            context.FavouriteBooks.AddRange(\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = mine.Id },\n                new FavouriteBook { UserId = \u0022reader-2\u0022, BookId = theirs.Id });\n            await context.SaveChangesAsync();\n\n            var result = await ControllerFor(context, \u0022reader-1\u0022).GetIds();\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            Assert.Equal(new[] { mine.Id }, Assert.IsAssignableFrom\u003CIEnumerable\u003Cint\u003E\u003E(ok.Value));\n        }\n\n        [Fact]\n        public async Task Remove_Takes_The_Book_Off_Only_That_Readers_Favourites()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n            context.FavouriteBooks.AddRange(\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = book.Id },\n                new FavouriteBook { UserId = \u0022reader-2\u0022, BookId = book.Id });\n            await context.SaveChangesAsync();\n\n            var result = await ControllerFor(context, \u0022reader-1\u0022).Remove(book.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Equal(\u0022reader-2\u0022, (await context.FavouriteBooks.SingleAsync()).UserId);\n        }\n\n        [Fact]\n        public async Task Remove_A_Book_That_Is_Not_A_Favourite_Is_Harmless()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            Assert.IsType\u003CNoContentResult\u003E(await ControllerFor(context, \u0022reader-1\u0022).Remove(123));\n        }\n\n        [Fact]\n        public async Task Deleting_A_Book_Removes_It_From_Favourites()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n            context.FavouriteBooks.Add(new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = book.Id });\n            await context.SaveChangesAsync();\n\n            context.Books.Remove(book);\n            await context.SaveChangesAsync();\n\n            using var check = factory.CreateContext();\n            Assert.Empty(await check.FavouriteBooks.ToListAsync());\n        }\n\n        [Fact]\n        public async Task The_Same_Reader_Cannot_Hold_The_Same_Favourite_Twice_In_The_Database()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            await context.SaveChangesAsync();\n            context.FavouriteBooks.AddRange(\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = book.Id },\n                new FavouriteBook { UserId = \u0022reader-1\u0022, BookId = book.Id });\n\n            await Assert.ThrowsAsync\u003CDbUpdateException\u003E(() =\u003E context.SaveChangesAsync());\n        }\n\n        [Fact]\n        public async Task Requests_Without_A_User_Id_Are_Unauthorized()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var controller = ControllerFor(context, null);\n\n            Assert.IsType\u003CUnauthorizedResult\u003E((await controller.GetAll()).Result);\n            Assert.IsType\u003CUnauthorizedResult\u003E((await controller.GetIds()).Result);\n            Assert.IsType\u003CUnauthorizedResult\u003E(await controller.Add(1));\n            Assert.IsType\u003CUnauthorizedResult\u003E(await controller.Remove(1));\n        }\n\n        [Fact]\n        public void Controller_Requires_A_Signed_In_User_Of_Any_Role()\n        {\n            var authorize = typeof(FavouritesController).GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorize);\n            Assert.Null(authorize!.Roles);\n        }\n    }\n}\n","tests":[{"id":"1ae0b7d1-a63b-f773-b3e7-a754532b127c","name":"InventoryService.Tests.FavouritesControllerTests.FavouriteBook_DefaultValues_AreProperlyInitialized","location":{"start":{"line":38,"column":9},"end":{"line":46,"column":10}}},{"id":"095229ba-f403-e9d2-fb59-a408215b4bfb","name":"InventoryService.Tests.FavouritesControllerTests.Add_Marks_The_Book_For_That_Reader_Only","location":{"start":{"line":48,"column":9},"end":{"line":62,"column":10}}},{"id":"f6bdec02-8340-982d-db04-17ecc45e7c14","name":"InventoryService.Tests.FavouritesControllerTests.Add_Twice_Keeps_A_Single_Favourite","location":{"start":{"line":64,"column":9},"end":{"line":79,"column":10}}},{"id":"e94c1266-b696-f299-baef-d25be9243477","name":"InventoryService.Tests.FavouritesControllerTests.Add_Unknown_Book_Returns_NotFound","location":{"start":{"line":81,"column":9},"end":{"line":91,"column":10}}},{"id":"fe044bf5-1fd5-9a04-599e-a4c0ee1f86e2","name":"InventoryService.Tests.FavouritesControllerTests.GetAll_Returns_Most_Recently_Added_First","location":{"start":{"line":93,"column":9},"end":{"line":110,"column":10}}},{"id":"6b0359b0-8689-a5eb-80a1-3c47c5160b7e","name":"InventoryService.Tests.FavouritesControllerTests.GetIds_Returns_Only_The_Readers_Own_Book_Ids","location":{"start":{"line":112,"column":9},"end":{"line":130,"column":10}}},{"id":"e28fbee1-8d14-e849-0fea-dbe0ea313873","name":"InventoryService.Tests.FavouritesControllerTests.Remove_Takes_The_Book_Off_Only_That_Readers_Favourites","location":{"start":{"line":132,"column":9},"end":{"line":149,"column":10}}},{"id":"76e91d8e-5bca-b10c-5582-4aebc4e5f054","name":"InventoryService.Tests.FavouritesControllerTests.Remove_A_Book_That_Is_Not_A_Favourite_Is_Harmless","location":{"start":{"line":151,"column":9},"end":{"line":158,"column":10}}},{"id":"26b81b24-bcd5-56a2-da51-b30db2e085f3","name":"InventoryService.Tests.FavouritesControllerTests.Deleting_A_Book_Removes_It_From_Favourites","location":{"start":{"line":160,"column":9},"end":{"line":176,"column":10}}},{"id":"bbb787e3-31c5-5643-2167-2b5718b71f4f","name":"InventoryService.Tests.FavouritesControllerTests.The_Same_Reader_Cannot_Hold_The_Same_Favourite_Twice_In_The_Database","location":{"start":{"line":178,"column":9},"end":{"line":191,"column":10}}},{"id":"152acc75-12bf-2513-ddc5-429a9646ee80","name":"InventoryService.Tests.FavouritesControllerTests.Requests_Without_A_User_Id_Are_Unauthorized","location":{"start":{"line":193,"column":9},"end":{"line":204,"column":10}}},{"id":"63e9581d-b103-2dff-76c5-16c8f73d5a91","name":"InventoryService.Tests.FavouritesControllerTests.Controller_Requires_A_Signed_In_User_Of_Any_Role","location":{"start":{"line":206,"column":9},"end":{"line":213,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\GenreBooksAndSeederTests.cs":{"language":"cs","source":"using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class GenreBooksTests\n    {\n        [Fact]\n        public async Task GetBooks_Returns_Only_That_Categorys_Books_Newest_First()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var genre = new Genre { Name = \u0022History\u0022 };\n            context.Genres.Add(genre);\n            context.Books.AddRange(\n                CatalogueTestData.Book(\u0022Older\u0022, genre: \u0022History\u0022, createdAt: new DateTime(2026, 1, 1)),\n                CatalogueTestData.Book(\u0022Newer\u0022, genre: \u0022history\u0022, createdAt: new DateTime(2026, 2, 1)),\n                CatalogueTestData.Book(\u0022Other\u0022, genre: \u0022Fiction\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new GenresController(context).GetBooks(genre.Id);\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var books = Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(ok.Value).ToList();\n            Assert.Equal(new[] { \u0022Newer\u0022, \u0022Older\u0022 }, books.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task GetBooks_Respects_Limit()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var genre = new Genre { Name = \u0022History\u0022 };\n            context.Genres.Add(genre);\n            context.Books.AddRange(Enumerable.Range(1, 4).Select(n =\u003E CatalogueTestData.Book($\u0022Book {n}\u0022, genre: \u0022History\u0022)));\n            await context.SaveChangesAsync();\n\n            var result = await new GenresController(context).GetBooks(genre.Id, limit: 3);\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            Assert.Equal(3, Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(ok.Value).Count());\n        }\n\n        [Fact]\n        public async Task GetBooks_Unknown_Category_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new GenresController(context).GetBooks(99);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n        }\n    }\n\n    public class CatalogueSeederTests\n    {\n        [Fact]\n        public async Task Seed_Creates_An_Author_For_Each_Distinct_Book_Author()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Books.AddRange(\n                CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022),\n                CatalogueTestData.Book(\u0022Persuasion\u0022, \u0022 jane austen \u0022),\n                CatalogueTestData.Book(\u0022Swing Time\u0022, \u0022Zadie Smith\u0022));\n            await context.SaveChangesAsync();\n\n            await CatalogueSeeder.SeedAsync(context);\n\n            Assert.Equal(new[] { \u0022Jane Austen\u0022, \u0022Zadie Smith\u0022 }, (await context.Authors.OrderBy(a =\u003E a.Name).ToListAsync()).Select(a =\u003E a.Name));\n        }\n\n        [Fact]\n        public async Task Seed_Creates_The_Three_Starter_Lists()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Books.AddRange(Enumerable.Range(1, 8).Select(n =\u003E CatalogueTestData.Book($\u0022Book {n}\u0022, n \u003C= 5 ? \u0022Busy Author\u0022 : $\u0022Author {n}\u0022)));\n            context.Books.Add(CatalogueTestData.Book(\u0022Out of stock\u0022, \u0022Author 9\u0022, available: 0, createdAt: DateTime.UtcNow.AddDays(1)));\n            await context.SaveChangesAsync();\n\n            await CatalogueSeeder.SeedAsync(context);\n\n            var lists = await context.CuratedLists.Include(l =\u003E l.Items).ThenInclude(i =\u003E i.Book).Include(l =\u003E l.Items).ThenInclude(i =\u003E i.Author).ToListAsync();\n            var recommended = lists.Single(l =\u003E l.Key == CatalogueSeeder.RecommendedKey);\n            Assert.Equal(6, recommended.Items.Count);\n            Assert.All(recommended.Items, item =\u003E Assert.True(item.Book!.AvailableCopies \u003E 0));\n            Assert.Equal(Enumerable.Range(0, 6), recommended.Items.OrderBy(i =\u003E i.Position).Select(i =\u003E i.Position));\n\n            Assert.Equal(9, lists.Single(l =\u003E l.Key == CatalogueSeeder.Top100Key).Items.Count);\n\n            var popular = lists.Single(l =\u003E l.Key == CatalogueSeeder.PopularAuthorsKey);\n            Assert.Equal(CuratedListItemType.Authors, popular.ItemType);\n            Assert.Equal(\u0022Busy Author\u0022, popular.Items.OrderBy(i =\u003E i.Position).First().Author!.Name);\n        }\n\n        [Fact]\n        public async Task Seed_Leaves_Existing_Authors_And_Lists_Alone()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Books.Add(CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022));\n            context.Authors.Add(new Author { Name = \u0022Hand Picked\u0022 });\n            context.CuratedLists.Add(new CuratedList { Key = \u0022staff-picks\u0022, Name = \u0022Staff picks\u0022 });\n            await context.SaveChangesAsync();\n\n            await CatalogueSeeder.SeedAsync(context);\n            await CatalogueSeeder.SeedAsync(context);\n\n            Assert.Equal(\u0022Hand Picked\u0022, (await context.Authors.SingleAsync()).Name);\n            Assert.Equal(\u0022staff-picks\u0022, (await context.CuratedLists.SingleAsync()).Key);\n        }\n\n        [Fact]\n        public async Task Seed_On_An_Empty_Catalogue_Creates_Empty_Lists()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            await CatalogueSeeder.SeedAsync(context);\n\n            Assert.Empty(await context.Authors.ToListAsync());\n            Assert.Equal(3, await context.CuratedLists.CountAsync());\n            Assert.Empty(await context.CuratedListItems.ToListAsync());\n        }\n    }\n}\n","tests":[{"id":"1ed320ca-e90b-a8ae-a453-e2761ee429f3","name":"InventoryService.Tests.GenreBooksTests.GetBooks_Returns_Only_That_Categorys_Books_Newest_First","location":{"start":{"line":18,"column":9},"end":{"line":36,"column":10}}},{"id":"f0a8b276-93cc-c6ab-a598-88807d13d979","name":"InventoryService.Tests.GenreBooksTests.GetBooks_Respects_Limit","location":{"start":{"line":38,"column":9},"end":{"line":52,"column":10}}},{"id":"c31f8a85-1581-fce8-4002-4c043b2e3b28","name":"InventoryService.Tests.GenreBooksTests.GetBooks_Unknown_Category_Returns_NotFound","location":{"start":{"line":54,"column":9},"end":{"line":63,"column":10}}},{"id":"8eb089d7-6ab6-b7bd-b752-fc681c888228","name":"InventoryService.Tests.CatalogueSeederTests.Seed_Creates_An_Author_For_Each_Distinct_Book_Author","location":{"start":{"line":68,"column":9},"end":{"line":82,"column":10}}},{"id":"73fc01c9-e3ff-3698-7c05-0918b3e55f83","name":"InventoryService.Tests.CatalogueSeederTests.Seed_Creates_The_Three_Starter_Lists","location":{"start":{"line":84,"column":9},"end":{"line":106,"column":10}}},{"id":"a4076870-90f6-ca43-a5e3-785ebf6c89df","name":"InventoryService.Tests.CatalogueSeederTests.Seed_Leaves_Existing_Authors_And_Lists_Alone","location":{"start":{"line":108,"column":9},"end":{"line":123,"column":10}}},{"id":"895995cd-efd5-b918-640a-f2a3c1eaee93","name":"InventoryService.Tests.CatalogueSeederTests.Seed_On_An_Empty_Catalogue_Creates_Empty_Lists","location":{"start":{"line":125,"column":9},"end":{"line":136,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\GenresControllerTests.cs":{"language":"cs","source":"using System;\nusing System.Linq;\nusing System.Reflection;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class GenresControllerTests\n    {\n        private InventoryDbContext GetDbContext()\n        {\n            var options = new DbContextOptionsBuilder\u003CInventoryDbContext\u003E()\n                .UseInMemoryDatabase(databaseName: Guid.NewGuid().ToString())\n                .Options;\n\n            return new InventoryDbContext(options);\n        }\n\n        [Fact]\n        public async Task Admin_Can_Create_Genre()\n        {\n            using var context = GetDbContext();\n            var controller = new GenresController(context);\n\n            var result = await controller.Create(new CreateGenreRequest { Name = \u0022  Science Fiction  \u0022 });\n\n            var created = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CGenreResponse\u003E(created.Value);\n            Assert.Equal(\u0022Science Fiction\u0022, response.Name);\n            Assert.NotEqual(0, response.Id);\n        }\n\n        [Fact]\n        public async Task Create_Duplicate_Genre_Is_Rejected_Case_Insensitively()\n        {\n            using var context = GetDbContext();\n            context.Genres.Add(new Genre { Name = \u0022Fantasy\u0022 });\n            await context.SaveChangesAsync();\n            var controller = new GenresController(context);\n\n            var result = await controller.Create(new CreateGenreRequest { Name = \u0022 fantasy \u0022 });\n\n            var conflict = Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n            Assert.Equal(409, conflict.StatusCode);\n        }\n\n        [Fact]\n        public async Task Update_Genre_Renames_Assigned_Books()\n        {\n            using var context = GetDbContext();\n            var genre = new Genre { Name = \u0022History\u0022 };\n            context.Genres.Add(genre);\n            context.Books.Add(new Book\n            {\n                Title = \u0022A History Book\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022history-1\u0022,\n                Genre = \u0022History\u0022,\n                TotalCopies = 1,\n                AvailableCopies = 1\n            });\n            await context.SaveChangesAsync();\n            var controller = new GenresController(context);\n\n            var result = await controller.Update(genre.Id, new UpdateGenreRequest { Name = \u0022World History\u0022 });\n\n            Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            Assert.Equal(\u0022World History\u0022, (await context.Books.SingleAsync()).Genre);\n        }\n\n        [Fact]\n        public async Task Delete_In_Use_Genre_Returns_Conflict()\n        {\n            using var context = GetDbContext();\n            var genre = new Genre { Name = \u0022Biography\u0022 };\n            context.Genres.Add(genre);\n            context.Books.Add(new Book\n            {\n                Title = \u0022A Life\u0022,\n                Author = \u0022Author\u0022,\n                ISBN = \u0022bio-1\u0022,\n                Genre = \u0022Biography\u0022,\n                TotalCopies = 1,\n                AvailableCopies = 1\n            });\n            await context.SaveChangesAsync();\n            var controller = new GenresController(context);\n\n            var result = await controller.Delete(genre.Id);\n\n            var conflict = Assert.IsType\u003CConflictObjectResult\u003E(result);\n            Assert.Equal(409, conflict.StatusCode);\n        }\n\n        [Fact]\n        public async Task Admin_Can_Delete_Unused_Genre()\n        {\n            using var context = GetDbContext();\n            var genre = new Genre { Name = \u0022Unused\u0022 };\n            context.Genres.Add(genre);\n            await context.SaveChangesAsync();\n            var controller = new GenresController(context);\n\n            var result = await controller.Delete(genre.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Empty(await context.Genres.ToListAsync());\n        }\n\n        [Fact]\n        public void Mutating_Genre_Endpoints_Require_Admin_Role()\n        {\n            var methods = new[]\n            {\n                nameof(GenresController.Create),\n                nameof(GenresController.Update),\n                nameof(GenresController.Delete)\n            };\n\n            foreach (var method in methods)\n            {\n                var methodInfo = typeof(GenresController).GetMethod(method);\n                Assert.NotNull(methodInfo);\n                var authorize = methodInfo!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n                Assert.NotNull(authorize);\n                Assert.Equal(\u0022Admin\u0022, authorize!.Roles);\n            }\n        }\n    }\n}\n","tests":[{"id":"541686e9-2c55-dc92-8233-70ed4b2a838d","name":"InventoryService.Tests.GenresControllerTests.Admin_Can_Create_Genre","location":{"start":{"line":27,"column":9},"end":{"line":39,"column":10}}},{"id":"987622eb-23ff-1bb7-620f-f549db0b3fc6","name":"InventoryService.Tests.GenresControllerTests.Create_Duplicate_Genre_Is_Rejected_Case_Insensitively","location":{"start":{"line":41,"column":9},"end":{"line":53,"column":10}}},{"id":"fa81d790-05eb-3956-b319-477eb91ac137","name":"InventoryService.Tests.GenresControllerTests.Update_Genre_Renames_Assigned_Books","location":{"start":{"line":55,"column":9},"end":{"line":77,"column":10}}},{"id":"6cb1d921-db52-a7cb-4f3a-f071d2781e84","name":"InventoryService.Tests.GenresControllerTests.Delete_In_Use_Genre_Returns_Conflict","location":{"start":{"line":79,"column":9},"end":{"line":101,"column":10}}},{"id":"9fd6d16d-dcaa-1a2f-176c-24a6625b9384","name":"InventoryService.Tests.GenresControllerTests.Admin_Can_Delete_Unused_Genre","location":{"start":{"line":103,"column":9},"end":{"line":116,"column":10}}},{"id":"ed8b624c-dcee-cbf5-f99b-46d7dbca7acc","name":"InventoryService.Tests.GenresControllerTests.Mutating_Genre_Endpoints_Require_Admin_Role","location":{"start":{"line":118,"column":9},"end":{"line":136,"column":10}}}]},"C:\\Computer_Science_Local_Files\\Year_3\\Semester_01\\Case_Study_Project\\Assignment\\reading-pal\\tests\\unit-tests\\InventoryService.Tests\\ListsControllerTests.cs":{"language":"cs","source":"using System.Collections.Generic;\nusing System.Linq;\nusing System.Reflection;\nusing System.Threading.Tasks;\nusing InventoryService.Controllers;\nusing InventoryService.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\nusing InventoryService.Tests.TestSupport;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Xunit;\n\nnamespace InventoryService.Tests\n{\n    public class ListsControllerTests\n    {\n        private static async Task\u003CCuratedList\u003E AddListAsync(InventoryDbContext context, string key, string name, CuratedListItemType type = CuratedListItemType.Books)\n        {\n            var list = new CuratedList { Key = key, Name = name, ItemType = type };\n            context.CuratedLists.Add(list);\n            await context.SaveChangesAsync();\n            return list;\n        }\n\n        private static CuratedListResponse Body(ActionResult\u003CCuratedListResponse\u003E result)\n        {\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            return Assert.IsType\u003CCuratedListResponse\u003E(ok.Value);\n        }\n\n        [Fact]\n        public async Task GetAll_Returns_Lists_By_Name_With_Item_Counts()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022Emma\u0022);\n            context.Books.Add(book);\n            var top = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            await AddListAsync(context, \u0022popular-authors\u0022, \u0022Popular Authors\u0022, CuratedListItemType.Authors);\n            context.CuratedListItems.Add(new CuratedListItem { CuratedListId = top.Id, BookId = book.Id });\n            await context.SaveChangesAsync();\n\n            var result = await new ListsController(context).GetAll();\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var lists = Assert.IsAssignableFrom\u003CIEnumerable\u003CCuratedListSummaryResponse\u003E\u003E(ok.Value).ToList();\n            Assert.Equal(new[] { \u0022popular-authors\u0022, \u0022top-100\u0022 }, lists.Select(l =\u003E l.Key));\n            Assert.Equal(\u0022Authors\u0022, lists[0].ItemType);\n            Assert.Equal(0, lists[0].ItemCount);\n            Assert.Equal(1, lists[1].ItemCount);\n        }\n\n        [Fact]\n        public async Task GetByKey_Returns_Books_In_List_Order()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var first = CatalogueTestData.Book(\u0022First\u0022);\n            var second = CatalogueTestData.Book(\u0022Second\u0022, available: 0);\n            context.Books.AddRange(first, second);\n            var list = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            context.CuratedListItems.AddRange(\n                new CuratedListItem { CuratedListId = list.Id, BookId = second.Id, Position = 1 },\n                new CuratedListItem { CuratedListId = list.Id, BookId = first.Id, Position = 0 });\n            await context.SaveChangesAsync();\n\n            var body = Body(await new ListsController(context).GetByKey(\u0022TOP-100\u0022));\n\n            Assert.Equal(\u0022Books\u0022, body.ItemType);\n            Assert.Equal(2, body.ItemCount);\n            Assert.Equal(new[] { \u0022First\u0022, \u0022Second\u0022 }, body.Books.Select(b =\u003E b.Title));\n            Assert.False(body.Books[1].IsAvailable);\n            Assert.Empty(body.Authors);\n        }\n\n        [Fact]\n        public async Task GetByKey_With_Limit_Returns_The_First_Items_And_The_Full_Count()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var books = Enumerable.Range(0, 5).Select(n =\u003E CatalogueTestData.Book($\u0022Book {n}\u0022)).ToList();\n            context.Books.AddRange(books);\n            var list = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            context.CuratedListItems.AddRange(books.Select((book, position) =\u003E new CuratedListItem { CuratedListId = list.Id, BookId = book.Id, Position = position }));\n            await context.SaveChangesAsync();\n\n            var body = Body(await new ListsController(context).GetByKey(\u0022top-100\u0022, limit: 2));\n\n            Assert.Equal(new[] { \u0022Book 0\u0022, \u0022Book 1\u0022 }, body.Books.Select(b =\u003E b.Title));\n            Assert.Equal(5, body.ItemCount);\n        }\n\n        [Fact]\n        public async Task GetByKey_Returns_Authors_With_Book_Counts_For_An_Author_List()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var austen = new Author { Name = \u0022Jane Austen\u0022 };\n            var smith = new Author { Name = \u0022Zadie Smith\u0022 };\n            context.Authors.AddRange(austen, smith);\n            context.Books.Add(CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022));\n            var list = await AddListAsync(context, \u0022popular-authors\u0022, \u0022Popular Authors\u0022, CuratedListItemType.Authors);\n            context.CuratedListItems.AddRange(\n                new CuratedListItem { CuratedListId = list.Id, AuthorId = smith.Id, Position = 0 },\n                new CuratedListItem { CuratedListId = list.Id, AuthorId = austen.Id, Position = 1 });\n            await context.SaveChangesAsync();\n\n            var body = Body(await new ListsController(context).GetByKey(\u0022popular-authors\u0022));\n\n            Assert.Equal(new[] { \u0022Zadie Smith\u0022, \u0022Jane Austen\u0022 }, body.Authors.Select(a =\u003E a.Name));\n            Assert.Equal(1, body.Authors[1].BookCount);\n            Assert.Empty(body.Books);\n        }\n\n        [Fact]\n        public async Task GetByKey_Unknown_List_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new ListsController(context).GetByKey(\u0022nope\u0022);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Admin_Can_Create_List()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new ListsController(context).Create(new CreateCuratedListRequest { Key = \u0022top-100\u0022, Name = \u0022  Top 100 \u0022, ItemType = \u0022books\u0022 });\n\n            var created = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var body = Assert.IsType\u003CCuratedListResponse\u003E(created.Value);\n            Assert.Equal(\u0022top-100\u0022, body.Key);\n            Assert.Equal(\u0022Top 100\u0022, body.Name);\n            Assert.Equal(\u0022Books\u0022, body.ItemType);\n            Assert.Equal(0, body.ItemCount);\n        }\n\n        [Fact]\n        public async Task Create_With_Existing_Key_Returns_Conflict()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n\n            var result = await new ListsController(context).Create(new CreateCuratedListRequest { Key = \u0022top-100\u0022, Name = \u0022Another\u0022, ItemType = \u0022Books\u0022 });\n\n            Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n        }\n\n        [Theory]\n        [InlineData(\u0022Magazines\u0022)]\n        [InlineData(\u00227\u0022)]\n        public async Task Create_With_Unknown_Item_Type_Returns_BadRequest(string itemType)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new ListsController(context).Create(new CreateCuratedListRequest { Key = \u0022mags\u0022, Name = \u0022Mags\u0022, ItemType = itemType });\n\n            Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n        }\n\n        [Theory]\n        [InlineData(\u0022top-100\u0022, true)]\n        [InlineData(\u0022popular\u0022, true)]\n        [InlineData(\u0022Top 100\u0022, false)]\n        [InlineData(\u0022top--100\u0022, false)]\n        [InlineData(\u0022-top\u0022, false)]\n        [InlineData(\u0022\u0022, false)]\n        public void Create_Request_Validates_The_Key_Format(string key, bool expectedValid)\n        {\n            var request = new CreateCuratedListRequest { Key = key, Name = \u0022Name\u0022, ItemType = \u0022Books\u0022 };\n\n            var valid = System.ComponentModel.DataAnnotations.Validator.TryValidateObject(\n                request, new System.ComponentModel.DataAnnotations.ValidationContext(request), null, validateAllProperties: true);\n\n            Assert.Equal(expectedValid, valid);\n        }\n\n        [Fact]\n        public async Task Update_Renames_The_List_And_Keeps_Its_Key()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n\n            var body = Body(await new ListsController(context).Update(\u0022top-100\u0022, new UpdateCuratedListRequest { Name = \u0022 Readers\u0027 favourites \u0022 }));\n\n            Assert.Equal(\u0022Readers\u0027 favourites\u0022, body.Name);\n            Assert.Equal(\u0022top-100\u0022, body.Key);\n        }\n\n        [Fact]\n        public async Task SetItems_Replaces_The_Contents_In_The_Given_Order()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var a = CatalogueTestData.Book(\u0022A\u0022);\n            var b = CatalogueTestData.Book(\u0022B\u0022);\n            var c = CatalogueTestData.Book(\u0022C\u0022);\n            context.Books.AddRange(a, b, c);\n            var list = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            context.CuratedListItems.AddRange(\n                new CuratedListItem { CuratedListId = list.Id, BookId = a.Id, Position = 0 },\n                new CuratedListItem { CuratedListId = list.Id, BookId = b.Id, Position = 1 });\n            await context.SaveChangesAsync();\n            var controller = new ListsController(context);\n\n            var body = Body(await controller.SetItems(\u0022top-100\u0022, new SetCuratedListItemsRequest { ItemIds = new List\u003Cint\u003E { c.Id, a.Id } }));\n\n            Assert.Equal(new[] { \u0022C\u0022, \u0022A\u0022 }, body.Books.Select(book =\u003E book.Title));\n            Assert.Equal(2, await context.CuratedListItems.CountAsync());\n        }\n\n        [Fact]\n        public async Task SetItems_With_An_Empty_List_Clears_It()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022A\u0022);\n            context.Books.Add(book);\n            var list = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            context.CuratedListItems.Add(new CuratedListItem { CuratedListId = list.Id, BookId = book.Id });\n            await context.SaveChangesAsync();\n\n            var body = Body(await new ListsController(context).SetItems(\u0022top-100\u0022, new SetCuratedListItemsRequest()));\n\n            Assert.Empty(body.Books);\n            Assert.Equal(0, body.ItemCount);\n        }\n\n        [Fact]\n        public async Task SetItems_On_An_Author_List_Uses_Author_Ids()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022 };\n            context.Authors.Add(author);\n            await AddListAsync(context, \u0022popular-authors\u0022, \u0022Popular Authors\u0022, CuratedListItemType.Authors);\n\n            var body = Body(await new ListsController(context).SetItems(\u0022popular-authors\u0022, new SetCuratedListItemsRequest { ItemIds = new List\u003Cint\u003E { author.Id } }));\n\n            Assert.Equal(\u0022Jane Austen\u0022, Assert.Single(body.Authors).Name);\n            var item = await context.CuratedListItems.SingleAsync();\n            Assert.Equal(author.Id, item.AuthorId);\n            Assert.Null(item.BookId);\n        }\n\n        [Fact]\n        public async Task SetItems_With_Unknown_Id_Returns_BadRequest_And_Changes_Nothing()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022A\u0022);\n            context.Books.Add(book);\n            var list = await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n            context.CuratedListItems.Add(new CuratedListItem { CuratedListId = list.Id, BookId = book.Id });\n            await context.SaveChangesAsync();\n\n            var result = await new ListsController(context).SetItems(\u0022top-100\u0022, new SetCuratedListItemsRequest { ItemIds = new List\u003Cint\u003E { book.Id, 9999 } });\n\n            Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n            Assert.Equal(1, await context.CuratedListItems.CountAsync());\n        }\n\n        [Fact]\n        public async Task SetItems_With_Duplicate_Ids_Returns_BadRequest()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var book = CatalogueTestData.Book(\u0022A\u0022);\n            context.Books.Add(book);\n            await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n\n            var result = await new ListsController(context).SetItems(\u0022top-100\u0022, new SetCuratedListItemsRequest { ItemIds = new List\u003Cint\u003E { book.Id, book.Id } });\n\n            Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Delete_Removes_The_List()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            await AddListAsync(context, \u0022top-100\u0022, \u0022Top 100\u0022);\n\n            var result = await new ListsController(context).Delete(\u0022top-100\u0022);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Empty(await context.CuratedLists.ToListAsync());\n        }\n\n        [Fact]\n        public async Task Write_Endpoints_On_Unknown_List_Return_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var controller = new ListsController(context);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E((await controller.Update(\u0022nope\u0022, new UpdateCuratedListRequest { Name = \u0022X\u0022 })).Result);\n            Assert.IsType\u003CNotFoundObjectResult\u003E((await controller.SetItems(\u0022nope\u0022, new SetCuratedListItemsRequest())).Result);\n            Assert.IsType\u003CNotFoundObjectResult\u003E(await controller.Delete(\u0022nope\u0022));\n        }\n\n        [Theory]\n        [InlineData(nameof(ListsController.Create))]\n        [InlineData(nameof(ListsController.Update))]\n        [InlineData(nameof(ListsController.SetItems))]\n        [InlineData(nameof(ListsController.Delete))]\n        public void Write_Endpoints_Require_Admin(string method)\n        {\n            var authorize = typeof(ListsController).GetMethod(method)!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorize);\n            Assert.Equal(\u0022Admin\u0022, authorize!.Roles);\n        }\n\n        [Theory]\n        [InlineData(nameof(ListsController.GetAll))]\n        [InlineData(nameof(ListsController.GetByKey))]\n        public void Read_Endpoints_Are_Public(string method)\n        {\n            Assert.Null(typeof(ListsController).GetMethod(method)!.GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n            Assert.Null(typeof(ListsController).GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n        }\n    }\n}\n","tests":[{"id":"496530d5-ac22-30b3-623e-ab282b478b79","name":"InventoryService.Tests.ListsControllerTests.GetAll_Returns_Lists_By_Name_With_Item_Counts","location":{"start":{"line":33,"column":9},"end":{"line":53,"column":10}}},{"id":"0861a75e-e983-bc0b-c067-0cbbe2b3fe7d","name":"InventoryService.Tests.ListsControllerTests.GetByKey_Returns_Books_In_List_Order","location":{"start":{"line":55,"column":9},"end":{"line":76,"column":10}}},{"id":"60c4a888-1712-0acd-e882-52ce3d4c4f6d","name":"Inven
