leResponse\u003E\u003E GetProfile([FromQuery] string? name)\n        {\n            var wanted = (name ?? string.Empty).Trim().ToLower();\n            if (wanted.Length == 0)\n            {\n                return BadRequest(new { message = \u0022An author name is required.\u0022 });\n            }\n\n            var author = await _context.Authors.FirstOrDefaultAsync(a =\u003E a.Name.ToLower() == wanted);\n            var books = await _context.Books\n                .Where(book =\u003E book.Author.ToLower() == wanted)\n                .OrderByDescending(book =\u003E book.CreatedAt)\n                .ThenByDescending(book =\u003E book.Id)\n                .ToListAsync();\n            if (author == null \u0026\u0026 books.Count == 0)\n            {\n                return NotFound(new { message = $\u0022No author named \u0027{name!.Trim()}\u0027 was found.\u0022 });\n            }\n\n            return Ok(new AuthorProfileResponse\n            {\n                Id = author?.Id,\n                Name = author?.Name ?? books[0].Author.Trim(),\n                Description = author?.Description,\n                ImageUrl = author?.ImageUrl,\n                BookCount = books.Count,\n                Books = books.Select(BookResponse.FromBook).ToList()\n            });\n        }\n\n        /// \u003Csummary\u003EThe books carrying this author\u0027s name, newest first.\u003C/summary\u003E\n        [HttpGet(\u0022{id:int}/books\u0022)]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CBookResponse\u003E\u003E\u003E GetBooks(int id, [FromQuery] int? limit = null)\n        {\n            var author = await _context.Authors.FindAsync(id);\n            if (author == null)\n            {\n                return NotFound(new { message = $\u0022Author with ID {id} not found.\u0022 });\n            }\n\n            var name = author.Name.ToLower();\n            IQueryable\u003CBook\u003E query = _context.Books\n                .Where(book =\u003E book.Author.ToLower() == name)\n                .OrderByDescending(book =\u003E book.CreatedAt);\n            if (limit is \u003E 0)\n            {\n                query = query.Take(limit.Value);\n            }\n\n            var books = await query.ToListAsync();\n            return Ok(books.Select(BookResponse.FromBook));\n        }\n\n        [HttpPost]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CAuthorResponse\u003E\u003E Create([FromBody] CreateAuthorRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var name = request.Name.Trim();\n            if (await _context.Authors.AnyAsync(a =\u003E a.Name.ToLower() == name.ToLower()))\n            {\n                return Conflict(new { message = $\u0022An author named \u0027{name}\u0027 already exists.\u0022 });\n            }\n\n            var now = DateTime.UtcNow;\n            var author = new Author\n            {\n                Name = name,\n                Description = Clean(request.Description),\n                ImageUrl = Clean(request.ImageUrl),\n                CreatedAt = now,\n                UpdatedAt = now\n            };\n            _context.Authors.Add(author);\n            await _context.SaveChangesAsync();\n\n            return CreatedAtAction(nameof(GetById), new { id = author.Id }, ToAuthorResponse(author, await BookCountsAsync()));\n        }\n\n        [HttpPut(\u0022{id:int}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CAuthorResponse\u003E\u003E Update(int id, [FromBody] UpdateAuthorRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var author = await _context.Authors.FindAsync(id);\n            if (author == null)\n            {\n                return NotFound(new { message = HttpGet]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CBookResponse\u003E\u003E\u003E GetAll()\n        {\n            var books = await _context.Books\n                .OrderByDescending(b =\u003E b.CreatedAt)\n                .ToListAsync();\n\n            return Ok(books.Select(ToBookResponse));\n        }\n\n        [HttpGet(\u0022{id}\u0022)]\n        public async Task\u003CActionResult\u003CBookResponse\u003E\u003E GetById(int id)\n        {\n            var book = await _context.Books.FindAsync(id);\n            if (book == null)\n            {\n                return NotFound(new { message = $\u0022Book with ID {id} not found.\u0022 });\n            }\n\n            return Ok(ToBookResponse(book));\n        }\n\n        [HttpPost(\u0022{id:int}/checkouts/{reservationId:int}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CIActionResult\u003E Checkout(int id, int reservationId, CancellationToken cancellationToken)\n        {\n            if (id \u003C= 0 || reservationId \u003C= 0)\n                return BadRequest(new { message = \u0022Book and reservation IDs must be positive.\u0022 });\n\n            await using var transaction = await _context.Database.BeginTransactionAsync(cancellationToken);\n            var previous = await _context.BookCheckouts.AsNoTracking()\n                .SingleOrDefaultAsync(c =\u003E c.Id == reservationId, cancellationToken);\n            if (previous != null)\n                return previous.BookId == id\n                    ? Ok(new { bookId = id, reservationId, previous.CheckoutDateUtc })\n                    : Conflict(new { message = \u0022This reservation already checked out a different book.\u0022 });\n\n            var checkoutDateUtc = DateTime.UtcNow;\n            var updated = await _context.Books.Where(b =\u003E b.Id == id \u0026\u0026 b.AvailableCopies \u003E 0)\n                .ExecuteUpdateAsync(setters =\u003E setters\n                    .SetProperty(b =\u003E b.AvailableCopies, b =\u003E b.AvailableCopies - 1)\n                    .SetProperty(b =\u003E b.UpdatedAt, checkoutDateUtc), cancellationToken);\n            if (updated == 0)\n            {\n                var exists = await _context.Books.AnyAsync(b =\u003E b.Id == id, cancellationToken);\n                return exists\n                    ? Conflict(new { message = \u0022No copies are available for checkout.\u0022 })\n                    : NotFound(new { message = \u0022Book not found.\u0022 });\n            }\n\n            _context.BookCheckouts.Add(new BookCheckout { Id = reservationId, BookId = id, CheckoutDateUtc = checkoutDateUtc });\n            // The count and retry record commit together. A failed transaction cannot deduct a copy.\n            await _context.SaveChangesAsync(cancellationToken);\n            await transaction.CommitAsync(cancellationToken);\n            return Ok(new { bookId = id, reservationId, checkoutDateUtc });\n        }\n\n        [HttpPost(\u0022{id:int}/checkouts/{reservationId:int}/return\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CIActionResult\u003E ReturnCheckout(int id, int reservationId, CancellationToken cancellationToken)\n        {\n            await using var transaction = await _context.Database.BeginTransactionAsync(cancellationToken);\n            // The conditional update locks the checkout row and makes concurrent retries harmless.\n            var changed = await _context.BookCheckouts\n                .Where(c =\u003E c.Id == reservationId \u0026\u0026 c.BookId == id \u0026\u0026 c.ReturnDateUtc == null)\n                .ExecuteUpdateAsync(s =\u003E s.SetProperty(c =\u003E c.ReturnDateUtc, DateTime.UtcNow), cancellationToken);\n            if (changed == 0)\n            {\n                var previous = await _context.BookCheckouts.AsNoTracking()\n                    .SingleOrDefaultAsync(c =\u003E c.Id == reservationId \u0026\u0026 c.BookId == id, cancellationToken);\n                return previous?.ReturnDateUtc != null\n                    ? Ok(new { bookId = id, reservationId })\n                    : NotFound(new { message = \u0022Matching inventory checkout not found.\u0022 });\n            }\n            var restored = await _context.Books.Where(b =\u003E b.Id == id \u0026\u0026 b.AvailableCopies \u003C b.TotalCopies)\n                .ExecuteUpdateAsync(s =\u003E s.SetProperty(b =\u003E b.AvailableCopies, b =\u003E b.AvailableCopies \u002B 1)\n                    .SetProperty(b =\u003E b.UpdatedAt, DateTime.UtcNow), cancellationToken);\n            if (restored == 0)\n                return Conflict(new { message = \u0022Inventory counts need review before this return can complete.\u0022 });\n            await transaction.CommitAsync(cancellationToken);\n            return Ok(new { bookId = id, reservationId });\n        }\n\n        [HttpDelete(\u0022{id}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CIActionResult\u003E Delete(int id)\n        {\n            var book = await _context.Books.FindAsync(id);\n            if (book == null)\n            {\n                return NotFound(new { message = $\u0022Book with ID {id} not found.\u0022 });\n            }\n\n            var borrowedCopies = book.TotalCopies - book.AvailableCopies;\n            if (borrowedCopies \u003E 0)\n            {\n                return Conflict(new { message = \u0022A book cannot be removed while copies are currently borrowed.\u0022 });\n            }\n\n            var deletedBook = ToBookResponse(book);\n            _context.Books.Remove(book);\n            await _context.SaveChangesAsync();\n\n            if (!await PublishEventAsync(\u0022book-deleted\u0022, deletedBook, \u0022deleted\u0022))\n            {\n                return KafkaFailure(deletedBook.Id);\n            }\n\n            return NoContent();\n        }\n\n        [HttpPost]\n        [Authorize(Roles = \u0022Admin\u     var book = await _context.Books.FindAsync(id);\n            if (book == null)\n            {\n                return NotFound(new { message = $\u0022Book with ID {id} not found.\u0022 });\n            }\n\n            var trimmedIsbn = request.ISBN?.Trim() ?? string.Empty;\n            var duplicateIsbn = await _context.Books.AnyAsync(b =\u003E b.Id != id \u0026\u0026 b.ISBN.ToLower() == trimmedIsbn.ToLower());\n            if (duplicateIsbn)\n            {\n                return Conflict(new { message = $\u0022A book with ISBN \u0027{request.ISBN}\u0027 already exists.\u0022 });\n            }\n\n            var borrowedCopies = book.TotalCopies - book.AvailableCopies;\n            if (request.TotalCopies \u003C borrowedCopies)\n            {\n                return BadRequest(new { message = $\u0022Total copies cannot be less than currently borrowed copies ({borrowedCopies}).\u0022 });\n            }\n\n            book.Title = request.Title.Trim();\n            book.Author = request.Author.Trim();\n            book.ISBN = trimmedIsbn;\n            book.Genre = request.Genre.Trim();\n            book.CoverImageUrl = NormalizeOptionalUrl(request.CoverImageUrl);\n            // A request that leaves the description out keeps the current one; an empty one clears it.\n            if (request.Description != null)\n            {\n                book.Description = NormalizeOptionalText(request.Description);\n            }\n            book.AvailableCopies = request.TotalCopies - borrowedCopies;\n            book.TotalCopies = request.TotalCopies;\n            book.UpdatedAt = DateTime.UtcNow;\n\n            await _context.SaveChangesAsync();\n\n            var response = ToBookResponse(book);\n            if (!await PublishEventAsync(\u0022book-updated\u0022, response, \u0022updated\u0022))\n            {\n                return KafkaFailure(book.Id);\n            }\n\n            return Ok(response);\n        }\n\n        [HttpPatch(\u0022{id}/mark-unavailable\u00 [ApiController]\n    [Route(\u0022api/books/search\u0022)]\n    public class BookSearchController : ControllerBase\n    {\n        public const int DefaultPageSize = 12;\n        public const int MaxPageSize = 48;\n        private const int MaxTerms = 8;\n\n        private readonly InventoryDbContext _context;\n\n        public BookSearchController(InventoryDbContext context)\n        {\n            _context = context;\n        }\n\n        /// \u003Cparam name=\u0022q\u0022\u003EWords to look for in the title, author, category or ISBN. Every word must match somewhere.\u003C/param\u003E\n        /// \u003Cparam name=\u0022genres\u0022\u003EOnly these categories (any of them). Repeat the parameter for several.\u003C/param\u003E\n        /// \u003Cparam name=\u0022availableOnly\u0022\u003EOnly books with a copy on the shelf.\u003C/param\u003E\n        /// \u003Cparam name=\u0022sort\u0022\u003Erelevance (default with a query), newest (default without), title, author.\u003C/param\u003E\n        [HttpGet]\n        public async Task\u003CActionResult\u003CBookSearchResponse\u003E\u003E Search(\n            [FromQuery] string? q = null,\n            [FromQuery] string[]? genres = null,\n            [FromQuery] bool availableOnly = false,\n            [FromQuery] string? sort = null,\n            [FromQuery] int page = 1,\n            [FromQuery] int pageSize = DefaultPageSize)\n        {\n            var phrase = (q ?? string.Empty).Trim().ToLower();\n            var terms = phrase.Split(\u0027 \u0027, StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries)\n                .Distinct().Take(MaxTerms).ToList();\n            var wantedGenres = (genres ?? Array.Empty\u003Cstring\u003E())\n                .Select(genre =\u003E genre.Trim().ToLower()).Where(genre =\u003E genre.Length \u003E 0).Distinct().ToList();\n            pageSize = Math.Clamp(pageSize \u003C= 0 ? DefaultPageSize : pageSize, 1, MaxPageSize);\n\n            IQueryable\u003CBook\u003E matchingText = _context.Books.AsNoTracking();\n            foreach (var term in terms)\n            {\n                matchingText = matchingText.Where(book =\u003E\n                    book.Title.ToLower().Contains(term) ||\n                    book.Author.ToLower().Contains(term) ||\n                    book.Genre.ToLower().Contains(term) ||\n                    book.ISBN.ToLower().Contains(term));\n            }\n\n            IQueryable\u003CBook\u003E InGenres(IQueryable\u003CBook\u003E books) =\u003E\n                wantedGenres.Count == 0 ? books : books.Where(book =\u003E wantedGenres.Contains(book.Genre.ToLower()));\n            IQueryable\u003CBook\u003E Available(IQueryable\u003CBook\u003E books) =\u003E\n                availableOnly ? books.Where(book =\u003E book.AvailableCopies \u003E 0) : books;\n\n            var results = Available(InGenres(matchingText));\n            var total = await results.CountAsync();\n            var totalPages = Math.Max(1, (int)Math.Ceiling(total / (double)pageSize));\n            // Asking for a page past the end (after narrowing the filters, say) shows the last page instead of nothing.\n            page = Math.Clamp(page, 1, totalPages);\n\n            var items = await Sort(results, sort, phrase)\n                .Skip((page - 1) * pageSize).Take(pageSize).ToListAsync();\n\n            // Each filter\u0027s counts leave that filter itself out, so the reader sees what ticking another box would add.\n            var genreCounts = await Available(matchingText)\n                .GroupBy(book =\u003E book.Genre)\n                .Select(group =\u003E new GenreFacet { Name = group.Key, Count = group.Count() })\n                .ToListAsync();\n\n            return Ok(new BookSearchResponse\n            {\n                Items = items.Select(BookResponse.FromBook).ToList(),\n                Total = total,\n                Page = page,\n                PageSize = pageSize,\n                TotalPages = totalPages,\n r\u0027s favourite books, most recently added first.\u003C/summary\u003E\n        [HttpGet]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CBookResponse\u003E\u003E\u003E GetAll()\n        {\n            var userId = CurrentUserId();\n            if (userId == null)\n            {\n                return Unauthorized();\n            }\n\n            var books = await _context.FavouriteBooks\n                .Where(favourite =\u003E favourite.UserId == userId)\n                .OrderByDescending(favourite =\u003E favourite.CreatedAt)\n                .ThenByDescending(favourite =\u003E favourite.Id)\n                .Select(favourite =\u003E favourite.Book!)\n                .ToListAsync();\n\n            return Ok(books.Select(BookResponse.FromBook));\n        }\n\n        /// \u003Csummary\u003EJust the IDs, for marking the hearts on a page of books.\u003C/summary\u003E\n        [HttpGet(\u0022ids\u0022)]\n        public async Task\u003CActionResult\u003CIEnumerable\u003Cint\u003E\u003E\u003E GetIds()\n        {\n            var userId = CurrentUserId();\n            if (userId == null)\n            {\n                return Unauthorized();\n            }\n\n            return Ok(await _context.FavouriteBooks\n                .Where(favourite =\u003E favourite.UserId == userId)\n                .Select(favourite =\u003E favourite.BookId)\n                .ToListAsync());\n        }\n\n        /// \u003Csummary\u003EMarks a book as a favourite. Doing it twice is harmless.\u003C/summary\u003E\n        [HttpPut(\u0022{bookId:int}\u0022)]\n        public async Task\u003CIActionResult\u003E Add(int bookId)\n        {\n            var userId = CurrentUserId();\n            if (userId == null)\n            {\n                return Unauthorized();\n            }\n\n            if (!await _context.Books.AnyAsync(book =\u003E book.Id == bookId))\n            {\n                return NotFound(new { message = $\u0022Book with ID {bookId} not found.\u0022 });\n            }\n\n            if (!await _context.FavouriteBooks.AnyAsync(favourite =\u003E favourite.UserId == userId \u0026\u0026 favourite.BookId == bookId))\n            {\n                _context.FavouriteBooks.Add(new FavouriteBook { UserId = userId, BookId = bookId, CreatedAt = DateTime.UtcNow });\n                try\n                {\n                    await _context.SaveChangesAsync();\n                }\n                catch (DbUpdateException)\n                {\n                    // Two quick presses of the heart: the other request saved it first, which is the outcome we wanted.\n                    _context.ChangeTracker.Clear();\n                    if (!await _context.FavouriteBooks.AnyAsync(favourite =\u003E favourite.UserId == userId \u0026\u0026 favourite.BookId == bookId))\n                    {\n                        throw;\n                    }\n                }\n            }\n\n            return NoContent();\n        }\n\n        /// \u003Csummary\u003ERemoves a book from the reader\u0027s favourites. Removing one that is not there is harmless.\u003C/summary\u003E\n        [HttpDelete(\u0022{bookId:int}\u0022)]\n        public async Task\u003CIActionResult\u003E Remove(int bookId)\n        {\n            var userId = CurrentUserId();\n            if (userId == null)\n            {\n                return Unauthorized();\n            }\n\n            var existing = await _context.FavouriteBooks\n                .Where(favourite =\u003E favourite.UserId == userId \u0026\u0026 favourite.BookId == bookId)\n                .ToListAsync();\n            if (existing.Count \u003E 0)\n            {\n                _context.FavouriteBooks.RemoveRange(existing);\n                await _context.SaveChangesAsync();\n            }\n\n            return NoContent();\n        }\n\n        private string? CurrentUserId()\n        {\n            var id = User?.FindFirstValue(ClaimTypes.NameIdentifier) ?? User?.FindFirstValue(\u0022sub\u0022);\n Route(\u0022api/[controller]\u0022)]\n    public class GenresController : ControllerBase\n    {\n        private readonly InventoryDbContext _context;\n\n        public GenresController(InventoryDbContext context)\n        {\n            _context = context;\n        }\n\n        [HttpGet]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CGenreResponse\u003E\u003E\u003E GetAll()\n        {\n            var genres = await _context.Genres\n                .OrderBy(g =\u003E g.Name)\n                .Select(g =\u003E ToGenreResponse(g))\n                .ToListAsync();\n\n            return Ok(genres);\n        }\n\n        /// \u003Csummary\u003EThe books in one category, newest first.\u003C/summary\u003E\n        [HttpGet(\u0022{id:int}/books\u0022)]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CBookResponse\u003E\u003E\u003E GetBooks(int id, [FromQuery] int? limit = null)\n        {\n            var genre = await _context.Genres.FindAsync(id);\n            if (genre == null)\n            {\n                return NotFound(new { message = $\u0022Genre with ID {id} not found.\u0022 });\n            }\n\n            var name = genre.Name.ToLower();\n            IQueryable\u003CBook\u003E query = _context.Books\n                .Where(book =\u003E book.Genre.ToLower() == name)\n                .OrderByDescending(book =\u003E book.CreatedAt);\n            if (limit is \u003E 0)\n            {\n                query = query.Take(limit.Value);\n            }\n\n            var books = await query.ToListAsync();\n            return Ok(books.Select(BookResponse.FromBook));\n        }\n\n        [HttpPost]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CGenreResponse\u003E\u003E Create([FromBody] CreateGenreRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var name = request.Name.Trim();\n            if (await _context.Genres.AnyAsync(g =\u003E g.Name.ToLower() == name.ToLower()))\n            {\n                return Conflict(new { message = $\u0022A genre named \u0027{name}\u0027 already exists.\u0022 });\n            }\n\n            var now = DateTime.UtcNow;\n            var genre = new Genre { Name = name, CreatedAt = now, UpdatedAt = now };\n            _context.Genres.Add(genre);\n            await _context.SaveChangesAsync();\n\n            return CreatedAtAction(nameof(GetAll), new { id = genre.Id }, ToGenreResponse(genre));\n        }\n\n        [HttpPut(\u0022{id}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CGenreResponse\u003E\u003E Update(int id, [FromBody] UpdateGenreRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var genre = await _context.Genres.FindAsync(id);\n            if (genre == null)\n            {\n                return NotFound(new { message = $\u0022Genre with ID {id} not found.\u0022 });\n            }\n\n            var name = request.Name.Trim();\n            if (await _context.Genres.AnyAsync(g =\u003E g.Id != id \u0026\u0026 g.Name.ToLower() == name.ToLower()))\n            {\n                return Conflict(new { message = $\u0022A genre named \u0027{name}\u0027 already exists.\u0022 });\n            }\n\n            var oldName = genre.Name;\n            genre.Name = name;\n            genre.UpdatedAt = DateTime.UtcNow;\n\n            var booksWithGenre = await _context.Books\n                .Where(book =\u003E book.Genre.ToLower() == oldName.ToLower())\n                .ToListAsync();\n            foreach (var book in booksWithGenre)\n            {\n                book.Genre = name;\n                book.UpdatedAt = DateTime.UtcNow;\n            }\n\n            await _context.SaveChangesAsync();\n            return Ok(ToGenreResponse(genre));\n        }\n\n        [HttpDelete(\u0022{id}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CIActionResult\u003E Delete(int id)\n        {\n            var genre = await _context.Genres.FindAsync(id);\n            if (genre == null)\n            {\n                return NotFound(new { message = $\u0022Genre with ID {id} not found.\u0022 });\n            }\n\n            var inUse = await _context.Books.AnyAsync(book =\u003E book.Genre.ToLower() == genre.Name.ToLower());\n            if (inUse)\n            {\n                return Conflict(new { message = \u0022This genre cannot be deleted while it is assigned to a book.\u0022 });\n            }\n\n            _context.Genres.Remove(genre);\n            await _context.SaveChangesAsync();\n            return NoContent();\n        }\n\n        private static GenreResponse ToGenreResponse(Genre genre)\n        {\n            return new GenreResponse\n            {\n                Id = genre.Id,\n                Name = genre.Name,\n                CreatedAt = genre.CreatedAt,\n                UpdatedAt = genre.UpdatedAt\n            };\n        }\n    }\n}\n","mutants":[{"id":"375","mutatorName":"Block removal mutation","replacement":"{}","location":{"start":{"line":17,"column":9},"end":{"line":19,"column":10}},"status":"Killed","static":false,"coveredBy":["987622eb-23ff-1bb7-620f-f549db0b3fc6","6cb1d921-db52-a7cb-4f3a-f071d2781e84","9fd6d16d-dcaa-1a2f-176c-24a6625b9384","fa81d790-05eb-3956-b319-477eb91ac137","541686e9-2c55-dc92-8233-70ed4b2a838d","c31f8a85-1581-fce8-4002-4c043b2e3b28","1ed320ca-e90b-a8ae-a453-e2761ee429f3","f0a8b276-93cc-c6ab-a598-88807d13d979"],"killedBy":["987622eb-23ff-1bb7-620f-f549db0b3fc6","6cb1d921-db52-a7cb-4f3a-f071d2781e84","9fd6d16d-dcaa-1a2f-176c-24a6625b9384","fa81d790-05eb-3956-b319-477eb91ac137","541686e9-2c55-dc92-8233-70ed4b2a838d","c31f8a85-1581-fce8-4002-4c043b2e3b28","1ed320ca-e90b-a8ae-a453-e2761ee429f3","f0a8b276-93cc-c6ab-a598-88 vice.Data;\nusing InventoryService.DTOs;\nusing InventoryService.Models;\n\nnamespace InventoryService.Controllers\n{\n    /// \u003Csummary\u003E\n    /// Curated lists (\u0022Top 100\u0022, \u0022Popular Authors\u0022). Anyone can read them; admins manage them.\n    /// \u003C/summary\u003E\n    [ApiController]\n    [Route(\u0022api/[controller]\u0022)]\n    public class ListsController : ControllerBase\n    {\n        private readonly InventoryDbContext _context;\n\n        public ListsController(InventoryDbContext context)\n        {\n            _context = context;\n        }\n\n        [HttpGet]\n        public async Task\u003CActionResult\u003CIEnumerable\u003CCuratedListSummaryResponse\u003E\u003E\u003E GetAll()\n        {\n            var lists = await _context.CuratedLists\n                .OrderBy(list =\u003E list.Name)\n                .Select(list =\u003E new { List = list, ItemCount = list.Items.Count })\n                .ToListAsync();\n\n            return Ok(lists.Select(entry =\u003E ToSummary(entry.List, entry.ItemCount)));\n        }\n\n        /// \u003Csummary\u003EOne list with its books or authors in order. Use limit to fetch only the first few.\u003C/summary\u003E\n        [HttpGet(\u0022{key}\u0022)]\n        public async Task\u003CActionResult\u003CCuratedListResponse\u003E\u003E GetByKey(string key, [FromQuery] int? limit = null)\n        {\n            var list = await FindAsync(key);\n            if (list == null)\n            {\n                return NotFound(new { message = $\u0022List \u0027{key}\u0027 not found.\u0022 });\n            }\n\n            return Ok(await ToResponseAsync(list, limit));\n        }\n\n        [HttpPost]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CCuratedListResponse\u003E\u003E Create([FromBody] CreateCuratedListRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var key = request.Key.Trim().ToLowerInvariant();\n            if (!Enum.TryParse\u003CCuratedListItemType\u003E(request.ItemType.Trim(), ignoreCase: true, out var itemType)\n                || !Enum.IsDefined(itemType))\n            {\n                return BadRequest(new { message = \u0022Item type must be Books or Authors.\u0022 });\n            }\n\n            if (await _context.CuratedLists.AnyAsync(list =\u003E list.Key == key))\n            {\n                return Conflict(new { message = $\u0022A list with the key \u0027{key}\u0027 already exists.\u0022 });\n            }\n\n            var now = DateTime.UtcNow;\n            var created = new CuratedList { Key = key, Name = request.Name.Trim(), ItemType = itemType, CreatedAt = now, UpdatedAt = now };\n            _context.CuratedLists.Add(created);\n            await _context.SaveChangesAsync();\n\n            return CreatedAtAction(nameof(GetByKey), new { key = created.Key }, await ToResponseAsync(created, null));\n        }\n\n        /// \u003Csummary\u003ERenames a list. Its key and item type stay fixed so pages that use it keep working.\u003C/summary\u003E\n        [HttpPut(\u0022{key}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CCuratedListResponse\u003E\u003E Update(string key, [FromBody] UpdateCuratedListRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var list = await FindAsync(key);\n            if (list == null)\n            {\n                return NotFound(new { message = $\u0022List \u0027{key}\u0027 not found.\u0022 });\n            }\n\n            list.Name = request.Name.Trim();\n            list.UpdatedAt = DateTime.UtcNow;\n            await _context.SaveChangesAsync();\n\n            return Ok(await ToResponseAsync(list, null));\n        }\n\n        /// \u003Csummary\u003EReplaces the list\u0027s contents with the given IDs, in the given order.\u003C/summary\u003E\n        [HttpPut(\u0022{key}/items\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CActionResult\u003CCuratedListResponse\u003E\u003E SetItems(string key, [FromBody] SetCuratedListItemsRequest request)\n        {\n            if (!ModelState.IsValid)\n            {\n                return BadRequest(ModelState);\n            }\n\n            var list = await FindAsync(key);\n            if (list == null)\n            {\n                return NotFound(new { message = $\u0022List \u0027{key}\u0027 not found.\u0022 });\n            }\n\n            var ids = request.ItemIds;\n            if (ids.Count != ids.Distinct().Count())\n            {\n                return BadRequest(new { message = \u0022The same item cannot appear on a list twice.\u0022 });\n            }\n\n            var known = list.ItemType == CuratedListItemType.Books\n                ? await _context.Books.Where(book =\u003E ids.Contains(book.Id)).Select(book =\u003E book.Id).ToListAsync()\n                : await _context.Authors.Where(author =\u003E ids.Contains(author.Id)).Select(author =\u003E author.Id).ToListAsync();\n            var missing = ids.Except(known).ToList();\n            if (missing.Count \u003E 0)\n            {\n                var kind = list.ItemType == CuratedListItemType.Books ? \u0022book\u0022 : \u0022author\u0022;\n                return BadRequest(new { message = $\u0022Unknown {kind} ID(s): {string.Join(\u0022, \u0022, missing)}.\u0022 });\n            }\n\n            var existing = await _context.CuratedListItems.Where(item =\u003E item.CuratedListId == list.Id).ToListAsync();\n            _context.CuratedListItems.RemoveRange(existing);\n            // Remove first so the replacement rows cannot collide with the unique (list, item) index.\n            await _context.SaveChangesAsync();\n\n            for (var position = 0; position \u003C ids.Count; position\u002B\u002B)\n            {\n                _context.CuratedListItems.Add(new CuratedListItem\n                {\n                    CuratedListId = list.Id,\n                    Position = position,\n                    BookId = list.ItemType == CuratedListItemType.Books ? ids[position] : null,\n                    AuthorId = list.ItemType == CuratedListItemType.Authors ? ids[position] : null\n                });\n            }\n\n            list.UpdatedAt = DateTime.UtcNow;\n            await _context.SaveChangesAsync();\n\n            return Ok(await ToResponseAsync(list, null));\n        }\n\n        [HttpDelete(\u0022{key}\u0022)]\n        [Authorize(Roles = \u0022Admin\u0022)]\n        public async Task\u003CIActionResult\u003E Delete(string key)\n        {\n            var list = await FindAsync(key);\n            if (list == null)\n            {\n                return NotFound(new { message = $\u0022List \u0027{key}\u0027 not found.\u0022 });\n            }\n\n            _context.CuratedLists.Remove(list);\n            await _context.SaveChangesAsync();\n            return NoContent();\n        }\n\n        private Task\u003CCuratedList?\u003E FindAsync(string key)\n        {\n            var normalized = (key ?? string.Empty).Trim().ToLowerInvariant();\n            return _context.CuratedLists.FirstOrDefaultAsync(list =\u003E list.Key == normalized);\n        }\n\n        private async Task\u003CCuratedListResponse\u003E ToResponseAsync(CuratedList list, int? limit)\n        {\n            var itemCount = await _context.CuratedListItems.CountAsync(item =\u003E item.CuratedListId == list.Id);\n            IQueryable\u003CCuratedListItem\u003E items = _context.CuratedListItems\n                .Where(item =\u003E item.CuratedListId == list.Id)\n                .OrderBy(item =\u003E item.Position);\n            if (limit is \u003E 0)\n            {\n                items = items.Take(limit.Value);\n            }\n\n            var summary = ToSummary(list  db.SaveChangesAsync();\n            }\n\n            if (await db.CuratedLists.AnyAsync())\n            {\n                return;\n            }\n\n            var recommended = new CuratedList { Key = RecommendedKey, Name = \u0022Recommended for you\u0022, ItemType = CuratedListItemType.Books };\n            var top100 = new CuratedList { Key = Top100Key, Name = \u0022Top 100\u0022, ItemType = CuratedListItemType.Books };\n            var popularAuthors = new CuratedList { Key = PopularAuthorsKey, Name = \u0022Popular Authors\u0022, ItemType = CuratedListItemType.Authors };\n\n            // Books that can be reserved right now make the better first impression.\n            AddBooks(recommended, books.OrderByDescending(book =\u003E book.AvailableCopies \u003E 0).Take(6));\n            AddBooks(top100, books.Take(100));\n\n            var bookCounts = books\n                .GroupBy(book =\u003E book.Author.Trim().ToLowerInvariant())\n                .ToDictionary(group =\u003E group.Key, group =\u003E group.Count());\n            var authors = await db.Authors.ToListAsync();\n            var position = 0;\n            foreach (var author in authors\n                .OrderByDescending(author =\u003E bookCounts.GetValueOrDefault(author.Name.Trim().ToLowerInvariant()))\n                .ThenBy(author =\u003E author.Name)\n                .Take(6))\n            {\n                popularAuthors.Items.Add(new CuratedListItem { AuthorId = author.Id, Position = position\u002B\u002B });\n            }\n\n            db.CuratedLists.AddRange(recommended, top100, popularAuthors);\n            await db.SaveChangesAsync();\n        }\n\n        private static void AddBooks(CuratedList list, IEnumerable\u003CBook\u003E books)\n        {\n            var position = 0;\n            foreach (var book in books)\n            {\n                list.Items.Add(new CuratedListItem { BookId = book.Id, Position = position\u002B\u002B });\n            }\n        }\n    }\n}\n","mutants" 0022Someone Else\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetAll();\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var authors = Assert.IsAssignableFrom\u003CIEnumerable\u003CAuthorResponse\u003E\u003E(ok.Value).ToList();\n            Assert.Equal(new[] { \u0022Jane Austen\u0022, \u0022Zadie Smith\u0022 }, authors.Select(a =\u003E a.Name));\n            Assert.Equal(2, authors[0].BookCount);\n            Assert.Equal(0, authors[1].BookCount);\n        }\n\n        [Fact]\n        public async Task GetById_Unknown_Author_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new AuthorsController(context).GetById(99);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task GetBooks_Returns_Only_That_Authors_Books_Newest_First()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022 };\n            context.Authors.Add(author);\n            context.Books.AddRange(\n                CatalogueTestData.Book(\u0022Older\u0022, \u0022Jane Austen\u0022, createdAt: new System.DateTime(2026, 1, 1)),\n                CatalogueTestData.Book(\u0022Newer\u0022, \u0022JANE AUSTEN\u0022, createdAt: new System.DateTime(2026, 2, 1)),\n                CatalogueTestData.Book(\u0022Other\u0022, \u0022Someone Else\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetBooks(author.Id);\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var books = Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(ok.Value).ToList();\n            Assert.Equal(new[] { \u0022Newer\u0022, \u0022Older\u0022 }, books.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task GetBooks_Respects_Limit()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022 };\n            context.Authors.Add(author);\n            context.Books.AddRange(Enumerable.Range(1, 4).Select(n =\u003E CatalogueTestData.Book($\u0022Book {n}\u0022, \u0022Jane Austen\u0022)));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetBooks(author.Id, limit: 2);\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            Assert.Equal(2, Assert.IsAssignableFrom\u003CIEnumerable\u003CBookResponse\u003E\u003E(ok.Value).Count());\n        }\n\n        [Fact]\n        public async Task GetBooks_Unknown_Author_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new AuthorsController(context).GetBooks(99);\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task GetProfile_Returns_The_Author_And_Their_Books_Newest_First()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022 };\n            context.Authors.Add(author);\n            context.Books.AddRange(\n                CatalogueTestData.Book(\u0022Older\u0022, \u0022Jane Austen\u0022, createdAt: new System.DateTime(2026, 1, 1)),\n                CatalogueTestData.Book(\u0022Newer\u0022, \u0022jane austen\u0022, createdAt: new System.DateTime(2026, 2, 1)),\n                CatalogueTestData.Book(\u0022Other\u0022, \u0022Someone Else\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetProfile(\u0022  JANE AUSTEN \u0022);\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            var profile = Assert.IsType\u003CAuthorProfileResponse\u003E(ok.Value);\n            Assert.Equal(author.Id, profile.Id);\n            Assert.Equal(\u0022Jane Austen\u0022, profile.Name);\n            Assert.Equal(2, profile.BookCount);\n            Assert.Equal(new[] { \u0022Newer\u0022, \u0022Older\u0022 }, profile.Books.Select(b =\u003E b.Title));\n        }\n\n        [Fact]\n        public async Task GetProfile_Works_For_An_Author_With_Books_But_No_Author_Entry()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Books.Add(CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetProfile(\u0022jane austen\u0022);\n\n            var profile = Assert.IsType\u003CAuthorProfileResponse\u003E(Assert.IsType\u003COkObjectResult\u003E(result.Result).Value);\n            Assert.Null(profile.Id);\n            Assert.Equal(\u0022Jane Austen\u0022, profile.Name);\n            Assert.Equal(\u0022Emma\u0022, Assert.Single(profile.Books).Title);\n        }\n\n        [Fact]\n        public async Task GetProfile_For_An_Author_Entry_Without_Books_Returns_An_Empty_List()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Authors.Add(new Author { Name = \u0022New Writer\u0022 });\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).GetProfile(\u0022New Writer\u0022);\n\n            var profile = Assert.IsType\u003CAuthorProfileResponse\u003E(Assert.IsType\u003COkObjectResult\u003E(result.Result).Value);\n            Assert.Equal(0, profile.BookCount);\n            Assert.Empty(profile.Books);\n        }\n\n        [Fact]\n        public async Task GetProfile_Unknown_Name_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E((await new AuthorsController(context).GetProfile(\u0022Nobody\u0022)).Result);\n        }\n\n        [Theory]\n        [InlineData(null)]\n        [InlineData(\u0022   \u0022)]\n        public async Task GetProfile_Without_A_Name_Returns_BadRequest(string? name)\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            Assert.IsType\u003CBadRequestObjectResult\u003E((await new AuthorsController(context).GetProfile(name)).Result);\n        }\n\n        [Fact]\n        public async Task Admin_Can_Create_Author_With_Trimmed_Name()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new AuthorsController(context).Create(new CreateAuthorRequest { Name = \u0022  Jane Austen  \u0022 });\n\n            var created = Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result);\n            var response = Assert.IsType\u003CAuthorResponse\u003E(created.Value);\n            Assert.Equal(\u0022Jane Austen\u0022, response.Name);\n            Assert.NotEqual(0, response.Id);\n        }\n\n        [Fact]\n        public async Task Create_Stores_Description_And_Image()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new AuthorsController(context).Create(new CreateAuthorRequest\n            {\n                Name = \u0022Jane Austen\u0022, Description = \u0022  English novelist.  \u0022, ImageUrl = \u0022 https://example.com/austen.jpg \u0022\n            });\n\n            var response = Assert.IsType\u003CAuthorResponse\u003E(Assert.IsType\u003CCreatedAtActionResult\u003E(result.Result).Value);\n            Assert.Equal(\u0022English novelist.\u0022, response.Description);\n            Assert.Equal(\u0022https://example.com/austen.jpg\u0022, response.ImageUrl);\n        }\n\n        [Fact]\n        public async Task Update_Keeps_Omitted_Details_And_Clears_Empty_Ones()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022, Description = \u0022English novelist.\u0022, ImageUrl = \u0022https://example.com/austen.jpg\u0022 };\n            context.Authors.Add(author);\n            await context.SaveChangesAsync();\n            var controller = new AuthorsController(context);\n\n            await controller.Update(author.Id, new UpdateAuthorRequest { Name = \u0022Jane Austen\u0022 });\n            Assert.Equal(\u0022English novelist.\u0022, author.Description);\n            Assert.Equal(\u0022https://example.com/austen.jpg\u0022, author.ImageUrl);\n\n            await controller.Update(author.Id, new UpdateAuthorRequest { Name = \u0022Jane Austen\u0022, Description = \u0022New text.\u0022, ImageUrl = \u0022  \u0022 });\n            Assert.Equal(\u0022New text.\u0022, author.Description);\n            Assert.Null(author.ImageUrl);\n        }\n\n        [Theory]\n        [InlineData(null, true)]\n        [InlineData(\u0022\u0022, true)]\n        [InlineData(\u0022   \u0022, true)]\n        [InlineData(\u0022https://example.com/a.jpg\u0022, true)]\n        [InlineData(\u0022not a link\u0022, false)]\n        [InlineData(\u0022ftp://example.com/a.jpg\u0022, false)]\n        public void Update_Request_Accepts_An_Empty_Image_Url_But_Not_A_Malformed_One(string? imageUrl, bool expectedValid)\n        {\n            var request = new UpdateAuthorRequest { Name = \u0022Jane Austen\u0022, ImageUrl = imageUrl };\n\n            var valid = System.ComponentModel.DataAnnotations.Validator.TryValidateObject(\n                request, new System.ComponentModel.DataAnnotations.ValidationContext(request), null, validateAllProperties: true);\n\n            Assert.Equal(expectedValid, valid);\n        }\n\n        [Fact]\n        public async Task GetProfile_Includes_Description_And_Image()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Authors.Add(new Author { Name = \u0022Jane Austen\u0022, Description = \u0022English novelist.\u0022, ImageUrl = \u0022https://example.com/austen.jpg\u0022 });\n            await context.SaveChangesAsync();\n\n            var profile = Assert.IsType\u003CAuthorProfileResponse\u003E(Assert.IsType\u003COkObjectResult\u003E((await new AuthorsController(context).GetProfile(\u0022jane austen\u0022)).Result).Value);\n\n            Assert.Equal(\u0022English novelist.\u0022, profile.Description);\n            Assert.Equal(\u0022https://example.com/austen.jpg\u0022, profile.ImageUrl);\n        }\n\n        [Fact]\n        public async Task Create_Duplicate_Author_Is_Rejected_Case_Insensitively()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            context.Authors.Add(new Author { Name = \u0022Jane Austen\u0022 });\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).Create(new CreateAuthorRequest { Name = \u0022 jane austen \u0022 });\n\n            Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Create_With_Invalid_Model_Returns_BadRequest()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var controller = new AuthorsController(context);\n            controller.ModelState.AddModelError(\u0022Name\u0022, \u0022Author name is required\u0022);\n\n            var result = await controller.Create(new CreateAuthorRequest());\n\n            Assert.IsType\u003CBadRequestObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Update_Renames_The_Authors_Books()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022J K Rowling\u0022 };\n            context.Authors.Add(author);\n            context.Books.AddRange(CatalogueTestData.Book(\u0022One\u0022, \u0022J K Rowling\u0022), CatalogueTestData.Book(\u0022Two\u0022, \u0022Someone Else\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).Update(author.Id, new UpdateAuthorRequest { Name = \u0022J.K. Rowling\u0022 });\n\n            var ok = Assert.IsType\u003COkObjectResult\u003E(result.Result);\n            Assert.Equal(1, Assert.IsType\u003CAuthorResponse\u003E(ok.Value).BookCount);\n            Assert.Equal(\u0022J.K. Rowling\u0022, (await context.Books.SingleAsync(b =\u003E b.Title == \u0022One\u0022)).Author);\n            Assert.Equal(\u0022Someone Else\u0022, (await context.Books.SingleAsync(b =\u003E b.Title == \u0022Two\u0022)).Author);\n        }\n\n        [Fact]\n        public async Task Update_To_Another_Authors_Name_Returns_Conflict()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var first = new Author { Name = \u0022First\u0022 };\n            context.Authors.AddRange(first, new Author { Name = \u0022Second\u0022 });\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).Update(first.Id, new UpdateAuthorRequest { Name = \u0022second\u0022 });\n\n            Assert.IsType\u003CConflictObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Update_Unknown_Author_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            var result = await new AuthorsController(context).Update(99, new UpdateAuthorRequest { Name = \u0022Nobody\u0022 });\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(result.Result);\n        }\n\n        [Fact]\n        public async Task Delete_Removes_The_Author_But_Keeps_Their_Books()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n            var author = new Author { Name = \u0022Jane Austen\u0022 };\n            context.Authors.Add(author);\n            context.Books.Add(CatalogueTestData.Book(\u0022Emma\u0022, \u0022Jane Austen\u0022));\n            await context.SaveChangesAsync();\n\n            var result = await new AuthorsController(context).Delete(author.Id);\n\n            Assert.IsType\u003CNoContentResult\u003E(result);\n            Assert.Empty(await context.Authors.ToListAsync());\n            Assert.Single(await context.Books.ToListAsync());\n        }\n\n        [Fact]\n        public async Task Delete_Unknown_Author_Returns_NotFound()\n        {\n            using var factory = new SqliteInventoryDbContextFactory();\n            using var context = factory.CreateContext();\n\n            Assert.IsType\u003CNotFoundObjectResult\u003E(await new AuthorsController(context).Delete(99));\n        }\n\n        [Theory]\n        [InlineData(nameof(AuthorsController.Create))]\n        [InlineData(nameof(AuthorsController.Update))]\n        [InlineData(nameof(AuthorsController.Delete))]\n        public void Write_Endpoints_Require_Admin(string method)\n        {\n            var authorize = typeof(AuthorsController).GetMethod(method)!.GetCustomAttribute\u003CAuthorizeAttribute\u003E();\n\n            Assert.NotNull(authorize);\n            Assert.Equal(\u0022Admin\u0022, authorize!.Roles);\n        }\n\n        [Theory]\n        [InlineData(nameof(AuthorsController.GetAll))]\n        [InlineData(nameof(AuthorsController.GetById))]\n        [InlineData(nameof(AuthorsController.GetBooks))]\n        [InlineData(nameof(AuthorsController.GetProfile))]\n        public void Read_Endpoints_Are_Public(string method)\n        {\n            Assert.Null(typeof(AuthorsController).GetMethod(method)!.GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n            Assert.Null(typeof(AuthorsController).GetCustomAttribute\u003CAuthorizeAttribute\u003E());\n        }\n    }\n}\n","tests":[{"id":"52fe84f6-9067-be22-d39c-26595b7aa83c","name":"InventoryService.Tests.AuthorsControllerTests.GetAll_Returns_Authors_By_Name_With_Book_Counts","location":{"start":{"line":18,"column":9},"end":{"line":37,"column":10}}},{"id":"6d25ef13-5276-449f-ce15-877e0e875e18","name":"InventoryService.Tests.AuthorsControllerTests.GetById_Unknown_Author_Returns_NotFound","location":{"start":{"line":39,"column":9},"end":{"line":48,"column":10}}},{"id":"4bb49f1c-804c-bda9-66b3-42838a05a1a9","name":"InventoryService.Tests.AuthorsControllerTests.GetBooks_Returns_Only_That_Authors_Books_Newest_First","location":{"start":{"line":50,"column":9},"end":{"line":68,"column":10}}},{"id":"bc9130cd-a0b3-64d2-7fa1-37768c780a0d","name":"InventoryService.Tests.AuthorsControllerTests.GetBooks_Respects_Limit","location":{"start":{"line":70,"column":9},"end":{"line":84,"column":10}}},{"id":"be5b3705-
