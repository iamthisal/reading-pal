name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            ".env.example"
            ".gitignore"
            ".dockerignore"
            "docker-compose.yml"
            "services/user-service/Dockerfile"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  build-and-test:
    name: Build and Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: |
          dotnet restore services/user-service/UserService.csproj
          test_projects=$(find tests/ -type f \( -name "*Test*.csproj" -o -name "*Tests*.csproj" \) ! -path "*Selenium*" 2>/dev/null || true)
          if [ -n "$test_projects" ]; then
            for proj in $test_projects; do
              dotnet restore "$proj"
            done
          fi

      - name: Build user-service
        run: dotnet build services/user-service/UserService.csproj --configuration Release --no-restore

      - name: Build test projects
        run: |
          test_projects=$(find tests/ services/user-service/ -type f \( -name "*Test*.csproj" -o -name "*Tests*.csproj" \) ! -path "*Selenium*" 2>/dev/null || true)
          if [ -n "$test_projects" ]; then
            for proj in $test_projects; do
              dotnet build "$proj" --configuration Release --no-restore
            done
          fi

      - name: Run tests
        run: |
          test_projects=$(find tests/ services/user-service/ -type f \( -name "*Test*.csproj" -o -name "*Tests*.csproj" \) ! -path "*Selenium*" 2>/dev/null || true)
          if [ -n "$test_projects" ]; then
            echo "Running tests for: $test_projects"
            for proj in $test_projects; do
              dotnet test "$proj" --configuration Release --no-build --verbosity normal
            done
          else
            echo "No test projects found. Skipping test execution gracefully."
          fi

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/user-service/Dockerfile
          push: false
          tags: ghcr.io/iamthisal/reading-pal-userservice:${{ github.sha }}
          cache-from: type=gha

  selenium-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: users_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore and Build Services
        run: |
          dotnet restore services/user-service/UserService.csproj
          dotnet build services/user-service/UserService.csproj --configuration Release
          dotnet restore tests/UserService.Selenium/UserService.Selenium.Tests.csproj
          dotnet build tests/UserService.Selenium/UserService.Selenium.Tests.csproj --configuration Release

      - name: Build Frontend for Testing
        env:
          VITE_API_BASE_URL: "http://localhost:8080"
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start User Service
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=users_db;Uid=root;Pwd=root;"
          ASPNETCORE_ENVIRONMENT: "Development"
          Frontend__Url: "http://localhost:5173"
        run: |
          dotnet run --project services/user-service/UserService.csproj --no-build --configuration Release --urls "http://localhost:8080" &
          for i in {1..30}; do
            if curl -s http://localhost:8080/health | grep -q "healthy"; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done

      - name: Start Frontend Preview
        run: |
          cd frontend
          npx vite preview --port 5173 --host &
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            sleep 1
          done

      - name: Run Selenium Tests
        env:
          CI: "true"
        run: |
          selenium_projects=$(find tests/ -type f -name "*Selenium*.csproj" 2>/dev/null || true)
          if [ -n "$selenium_projects" ]; then
            for proj in $selenium_projects; do
              dotnet test "$proj" --configuration Release --no-build --verbosity normal
            done
          fi
        continue-on-error: true


