# Requires AZURE_NOTIFICATION_WEBAPP_PUBLISH_PROFILE secret to be set in GitHub repository secrets.
# Optional: NOTIFICATION_SERVICE_URL repository variable (https://<notification hostname>) enables the post-deploy health check.
name: CD - Notification Service

on:
  workflow_run:
    workflows:
      - "CI - Notification Service"
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/reading-pal-notificationservice
  AZURE_WEBAPP_NAME: reading-pal-notificationservice

jobs:
  build-and-deploy-notificationservice:
    name: Build and Deploy Notification Service
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Tag
        run: |
          RESOLVED_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          LOWER_IMAGE="${IMAGE_BASE,,}"
          echo "IMAGE_TAG=${LOWER_IMAGE}:${RESOLVED_SHA}" >> $GITHUB_ENV

      - name: Build and push notification-service image
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          file: services/notification-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_NOTIFICATION_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_TAG }}

      # /health only proves the app started; check the App Service log stream for migration and Kafka consumer startup.
      - name: Post-deploy health check
        if: ${{ vars.NOTIFICATION_SERVICE_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.NOTIFICATION_SERVICE_URL }}/health" | grep -q healthy; then
              echo "Notification Service is healthy"
              exit 0
            fi
            echo "Waiting for Notification Service ($i/30)..."
            sleep 10
          done
          echo "::error::Notification Service did not become healthy after deploy"
          exit 1
