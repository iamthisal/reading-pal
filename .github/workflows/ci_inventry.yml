name: CI - Inventory Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "services/inventory-service/**"
      - "tests/InventoryService.Tests/**"
      - ".github/workflows/ci_inventry.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "services/inventory-service/**"
      - "tests/InventoryService.Tests/**"
      - ".github/workflows/ci_inventry.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: |
          dotnet restore services/inventory-service/InventoryService.csproj
          dotnet restore tests/InventoryService.Tests/InventoryService.Tests.csproj

      - name: Build Inventory Service
        run: dotnet build services/inventory-service/InventoryService.csproj --configuration Release --no-restore

      - name: Build Test Projects
        run: dotnet build tests/InventoryService.Tests/InventoryService.Tests.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/InventoryService.Tests/InventoryService.Tests.csproj --configuration Release --no-build --verbosity normal

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inventory-service Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inventory-service/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/reading-pal-inventoryservice:${{ github.sha }}
          cache-from: type=gha
