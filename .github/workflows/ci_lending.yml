#CI workflow dedicated exclusively to building and testing the Lending Service backend.
name: CI - Lending Service

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "services/lending-service/Dockerfile"
            "services/lending-service/LendingService.csproj"
            "tests/LendingService.Tests/LendingService.Tests.csproj"
            "infrastructure/mysql/init-databases.sh"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: |
          dotnet restore services/lending-service/LendingService.csproj
          dotnet restore tests/LendingService.Tests/LendingService.Tests.csproj

      - name: Build Lending Service
        run: dotnet build services/lending-service/LendingService.csproj --configuration Release --no-restore

      - name: Build Test Project
        run: dotnet build tests/LendingService.Tests/LendingService.Tests.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/LendingService.Tests/LendingService.Tests.csproj --configuration Release --no-build --verbosity normal

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Lending's Dockerfile expects its own folder as the build context (unlike user/inventory).
      - name: Build lending-service Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/lending-service
          file: services/lending-service/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/reading-pal-lendingservice:${{ github.sha }}
          cache-from: type=gha
