name: readingpal-events

services:
  # Sprint 02 - inventory Service
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "104857600"
      KAFKA_LOG_ROLL_HOURS: "1"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - events

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list > /dev/null 2>&1
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]

    ports:
      - "127.0.0.1:8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: readingpal
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - events

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  events:
    name: readingpal-events
    driver: bridge

volumes:
  kafka-data: